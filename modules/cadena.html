<!-- ══════════════════════════════════════════════
     MÓDULO: CADENA RT — Opciones GGAL realtime
     Columnas: BID / LAST / OFFER / VI% / VAR% / VOL
     Flash: bid, last, ask por separado via operations count
     Gráficos: Sonrisa de Volatilidad + Volumen por Strike (SVG)
══════════════════════════════════════════════ -->
<style>
.rtc-header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px;flex-wrap:wrap;gap:8px}
.rtc-title{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--text)}
.rtc-spot{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--text)}
.rtc-chg{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.rtc-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text3)}
.rtc-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:4px;padding:4px 12px;font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer;transition:filter .15s}
.rtc-btn:hover{filter:brightness(1.15)}

.rtc-exp-tabs{display:flex;gap:6px;padding:4px 0 10px;flex-wrap:wrap}
.rtc-etab{padding:4px 14px;border-radius:12px;border:1px solid var(--border2);background:var(--bg3);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .15s}
.rtc-etab.active{border-color:var(--green);background:rgba(0,229,168,.12);color:var(--green)}
.rtc-etab:hover:not(.active){border-color:var(--border);color:var(--text2)}

.rtc-scroll{overflow-x:auto;margin-top:2px}
.rtc-table{width:100%;min-width:1260px;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11px}

/* Section headers */
.rtc-th-section-calls{background:rgba(0,229,168,.07);color:var(--green);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:5px 8px;text-align:center;border-bottom:1px solid rgba(0,229,168,.2)}
.rtc-th-section-puts {background:rgba(255,63,94,.07); color:var(--red);  font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:5px 8px;text-align:center;border-bottom:1px solid rgba(255,63,94,.2)}
.rtc-th-section-mid  {background:var(--bg3);border-left:2px solid var(--border);border-right:2px solid var(--border)}

/* Column headers */
.rtc-th{font-size:7px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:5px 8px;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap;color:var(--text3)}
.rtc-th.l{text-align:left}
.rtc-th.c{text-align:center;border-left:2px solid var(--border);border-right:2px solid var(--border);color:var(--text2)}
.rtc-th.gc{color:rgba(0,229,168,.7)}
.rtc-th.rc{color:rgba(255,63,94,.7)}

/* Data cells */
.rtc-td{padding:4px 8px;text-align:right;border-bottom:1px solid rgba(30,37,48,.5);font-size:11px;color:var(--text);white-space:nowrap}
.rtc-td.l{text-align:left;font-size:9px;color:var(--text3)}
.rtc-td.c{text-align:center;font-size:12px;font-weight:700;color:var(--text2);border-left:2px solid var(--border);border-right:2px solid var(--border)}
.rtc-td.bid {color:var(--green)}
.rtc-td.ask {color:var(--red)}
.rtc-td.iv  {color:var(--text3);font-size:10px}
.rtc-td.vol {color:var(--text3);font-size:10px}
.rtc-td.dash{color:var(--text3)}

/* Row states */
.rtc-call-itm{background:rgba(0,229,168,.025)}
.rtc-put-itm {background:rgba(255,63,94,.025)}
.rtc-atm-row {background:rgba(251,191,36,.065)!important}
.rtc-atm-row .rtc-td.c{color:var(--amber)}
.rtc-atm-badge{font-size:6px;font-weight:800;letter-spacing:1.2px;color:var(--amber);display:block;margin-top:1px}

/* VAR% badges */
.rtc-var{display:inline-block;border-radius:3px;padding:1px 6px;font-size:9px;font-weight:600;min-width:52px;text-align:center}
.rtc-var.pos{background:rgba(0,229,168,.2);color:var(--green)}
.rtc-var.neg{background:rgba(255,63,94,.2);color:var(--red)}
.rtc-var.neu{color:var(--text3)}

/* Flash animations */
@keyframes flashUp{0%{background:rgba(0,229,168,.45)}100%{background:transparent}}
@keyframes flashDn{0%{background:rgba(255,63,94,.45)}100%{background:transparent}}
.flash-up{animation:flashUp .9s ease-out forwards}
.flash-dn{animation:flashDn .9s ease-out forwards}

/* Charts */
.rtc-charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:820px){.rtc-charts{grid-template-columns:1fr}}
.rtc-chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px}
.rtc-chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rtc-chart-title{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)}
.rtc-chart-legend{display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:9px}
.rtc-chart-svg{display:block;width:100%;overflow:visible}

.rtc-empty{padding:32px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3)}

/* Leverage card modal */
.rtc-clk{cursor:pointer}
.rtc-clk:hover{text-decoration:underline;filter:brightness(1.35)}
#rtcCardOv{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:9999;display:none;align-items:center;justify-content:center;padding:14px}
#rtcCardOv.on{display:flex}
.rtc-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;max-width:740px;width:100%;max-height:94vh;overflow:auto;padding:16px 18px 20px;font-family:'IBM Plex Mono',monospace}
.rtc-card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rtc-card-ttl{font-size:17px;font-weight:800;color:var(--text)}
.rtc-card-sub{font-size:10px;color:var(--text3);margin-top:3px}
.rtc-card-x{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:5px;padding:5px 11px;font-family:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.rtc-card-x:hover{filter:brightness(1.2)}
.rtc-card-stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.rtc-stat{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 11px;min-width:92px}
.rtc-stat b{display:block;font-size:15px;color:var(--text);font-weight:700;line-height:1.2}
.rtc-stat span{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.rtc-card-lg{display:flex;gap:16px;font-size:10px;margin:6px 0 2px;flex-wrap:wrap;color:var(--text3)}
.rtc-card-svg{display:block;width:100%;overflow:visible;margin-top:4px}
.rtc-card-note{font-size:9px;color:var(--text3);margin-top:8px;line-height:1.5}
</style>

<div id="rtcWrap">

      <span class="rtc-title">GGAL</span>

<script>
(function(){

// ── BS IV con tasa libre de riesgo ────────────────────────────
const normCDF=z=>{const t=1/(1+0.2316419*Math.abs(z));const p=t*(0.31938153+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));const c=1-Math.exp(-0.5*z*z)/2.506628274590452*p;return z>=0?c:1-c};
const normPDF=z=>Math.exp(-0.5*z*z)/2.506628274590452;
const bsV=(S,K,T,s,c,r=0)=>{if(T<=0||s<=0)return Math.max(c?S-K:K-S,0);const q=Math.sqrt(T),d1=(Math.log(S/K)+(r+0.5*s*s)*T)/(s*q),d2=d1-s*q,disc=Math.exp(-r*T);return c?S*normCDF(d1)-K*disc*normCDF(d2):K*disc*normCDF(-d2)-S*normCDF(-d1)};
const bsDelta=(S,K,T,s,isC,r=0)=>{if(T<=0||s<=0||S<=0||K<=0)return null;const q=Math.sqrt(T),d1=(Math.log(S/K)+(r+0.5*s*s)*T)/(s*q);return isC?normCDF(d1):normCDF(d1)-1};
const calcIV=(price,S,K,T,isC,r=0)=>{if(!price||price<=0||T<=0||S<=0||K<=0)return null;if(price<Math.max(isC?S-K:K-S,0)-1)return null;let s=0.5;for(let i=0;i<80;i++){const q=Math.sqrt(T),d1=(Math.log(S/K)+(r+0.5*s*s)*T)/(s*q);const vg=S*q*normPDF(d1);if(vg<1e-8)break;const df=bsV(S,K,T,s,isC,r)-price;if(Math.abs(df)<0.02)break;s-=df/vg;if(s<=0.001){s=0.001;break;}if(s>15)return null}return s>0.001&&s<15?s:null};

// ── Format ────────────────────────────────────────────────────
const fn=(n,d=0)=>{if(n==null||isNaN(n))return'—';const p=Math.abs(n).toFixed(d).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'-':'')+p.join(',')};
const fk=n=>fn(n,1);
const fvol=n=>{if(!n||n<=0)return'—';if(n>=1000)return fn(n/1000,1)+'k';return fn(n,0)};
const mid=o=>o.bid!=null&&o.ask!=null?(o.bid+o.ask)/2:(o.last??o.ask??o.bid??null);

// ── State ─────────────────────────────────────────────────────
const SBR='https://endymbpdayeidromxayb.supabase.co/rest/v1/';
const KEY='sb_publishable_htIwpJMdPWs0ROzIml9Auw_bfBik5WY';
const sbF=(t,p)=>fetch(SBR+t+'?'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}).then(r=>r.ok?r.json():[]);

let gSpot=null, gOpts=[], gExp=null, gPrev={}, gTimer=null, gRate=0.30, gRateLive=false;
const rtcRateStyle=()=>{const inp=document.getElementById('rtcRateInput'),dot=document.getElementById('rtcRateDot');if(!inp)return;if(gRateLive){inp.style.borderColor='var(--border2)';inp.style.color='var(--text2)';if(dot){dot.textContent='●';dot.style.color='var(--green)';dot.title='Tasa desde cauciones RT';}}else{inp.style.borderColor='var(--red)';inp.style.color='var(--red)';if(dot){dot.textContent='●';dot.style.color='var(--red)';dot.title='Tasa hardcodeada — sin datos de cauciones';}}}

// ── Load ──────────────────────────────────────────────────────
window.rtcLoad=async()=>{
  try{
    const today=new Date().toISOString().slice(0,10);
    const[sR,oR,cR]=await Promise.all([
      sbF('mercado','symbol=eq.GGAL&settlement=eq.24hs&select=last,change&limit=1'),
      sbF('opciones_rt','underlying_asset=ilike.GGAL*&select=symbol,kind,strike,expiration,last,bid,ask,previous_close,volume,operations,bid_size,ask_size&order=expiration.asc,strike.asc&limit=1000'),
      sbF('cauciones','symbol=eq.PESOS&days=eq.1&select=bid_rate,ask_rate,settlement&order=settlement.desc&limit=1')
    ]);
    if(sR?.length){
      gSpot=sR[0].last;
      const chg=sR[0].change;
      document.getElementById('rtcSpot').textContent='$'+fn(gSpot);
      const el=document.getElementById('rtcChg');
      if(chg!=null){el.textContent=(chg>=0?'+':'')+fn(chg,2)+'%';el.style.color=chg>=0?'var(--green)':'var(--red)';}
    }
    if(cR?.length){
      const c=cR[0];
      const tna=c.bid_rate!=null&&c.ask_rate!=null?(c.bid_rate+c.ask_rate)/2:c.ask_rate??c.bid_rate;
      if(tna!=null&&tna>0){
        gRate=tna/100;
        gRateLive=true;
        const inp=document.getElementById('rtcRateInput');
        if(inp)inp.value=Math.round(tna);
      }
    }
    rtcRateStyle();
    const opts=(Array.isArray(oR)?oR:[]).filter(o=>o.expiration>=today);

    // Flash detection: track bid, ask, last, operations per symbol
    const newPrev={};
    opts.forEach(o=>{
      const prev=gPrev[o.symbol];
      newPrev[o.symbol]={bid:o.bid,ask:o.ask,last:o.last,ops:o.operations||0};
      if(prev){
        // New trade → operations count increased, or last price changed
        const newTrade=(o.operations||0)>(prev.ops||0)||(o.last!=null&&o.last!==prev.last);
        if(newTrade&&o.last!=null) o._fl=o.last>(prev.last??o.last)?'up':'dn';
        // Bid/ask quote update
        if(o.bid!=null&&o.bid!==prev.bid) o._fb=o.bid>(prev.bid??0)?'up':'dn';
        if(o.ask!=null&&o.ask!==prev.ask) o._fa=o.ask>(prev.ask??0)?'up':'dn';
      }
    });
    gPrev=newPrev;
    gOpts=opts;

    // Exp tabs
    const exps=[...new Set(opts.map(o=>o.expiration.slice(0,10)))].sort();
    const tabsEl=document.getElementById('rtcExpTabs');
    if(tabsEl.children.length!==exps.length){
      tabsEl.innerHTML=exps.map(e=>{
        const d=Math.ceil((new Date(e)-new Date())/86400000);
        return`<div class="rtc-etab${e===gExp?' active':''}" onclick="rtcSetExp('${e}',this)">${e}<span style="opacity:.55"> (${d}d)</span></div>`;
      }).join('');
      if(!gExp||!exps.includes(gExp)) gExp=exps[0]||null;
    }

    const now=new Date();
    document.getElementById('rtcUpd').textContent='Act. '+[now.getHours(),now.getMinutes(),now.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
    rtcRender();
  }catch(e){console.error('[cadena_rt]',e);}
};

window.rtcSetExp=(e,el)=>{
  gExp=e;
  document.querySelectorAll('.rtc-etab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  rtcRender();
};

// ── Render tabla ──────────────────────────────────────────────
window.rtcRender=()=>{
  const tbody=document.getElementById('rtcBody');
  if(!gSpot||!gOpts.length||!gExp){
    tbody.innerHTML=`<tr><td colspan="19" class="rtc-empty">Sin datos</td></tr>`;
    rtcDrawSmile([],null);rtcDrawVol([],null);return;
  }
  const T=Math.max((new Date(gExp)-new Date())/(365*86400000),1/365);
  const filt=gOpts.filter(o=>o.expiration.slice(0,10)===gExp);

  const byK=new Map();
  filt.forEach(o=>{
    if(!byK.has(o.strike))byK.set(o.strike,{k:o.strike,c:null,p:null});
    const row=byK.get(o.strike);
    if(o.kind==='CALL')row.c=o;else if(o.kind==='PUT')row.p=o;
  });
  const rows=[...byK.values()].sort((a,b)=>a.k-b.k);
  const atmK=rows.reduce((b,r)=>Math.abs(r.k-gSpot)<Math.abs(b.k-gSpot)?r:b,rows[0])?.k;

  const varBadge=v=>{
    if(v==null)return'<span class="rtc-var neu">—</span>';
    const cls=v>0.5?'pos':v<-0.5?'neg':'neu';
    return`<span class="rtc-var ${cls}">${v>=0?'+':''}${fn(v,1)}%</span>`;
  };
  const fDelta=d=>{if(d==null)return'<span style="color:var(--text3)">—</span>';const c=Math.abs(d)>=0.45&&Math.abs(d)<=0.55?'var(--amber)':d>0?'var(--green)':'var(--red)';return`<span style="color:${c};font-size:10px">${d.toFixed(2)}</span>`};
  // Palanca efectiva (omega/elasticidad) = |Δ|·Spot/Prima → cuánto se mueve la opción en % por cada 1% del subyacente
  const fLev=(o,d)=>{const m=mid(o);if(m==null||m<=0||d==null||!gSpot)return'<span style="color:var(--text3)">—</span>';const om=Math.abs(d)*gSpot/m;const c=om>=12?'var(--red)':om>=7?'var(--amber)':'var(--text2)';return`<span style="color:${c};font-size:10px" title="Palanca efectiva Ω = |Δ|·Spot/Prima">${om.toFixed(1)}x</span>`};
  const fCant=n=>{if(!n||n<=0)return'<span style="color:var(--text4)">—</span>';return`<span style="color:var(--text3);font-size:10px">${fn(n,0)}</span>`};
  const fl =o=>o?._fl==='up'?'flash-up':o?._fl==='dn'?'flash-dn':'';
  const fb =o=>o?._fb==='up'?'flash-up':o?._fb==='dn'?'flash-dn':'';
  const fa =o=>o?._fa==='up'?'flash-up':o?._fa==='dn'?'flash-dn':'';

  // Compute IVs and deltas for charts
  const chartRows=[];
  tbody.innerHTML=rows.map(r=>{
    const atm=r.k===atmK;
    const callITM=r.k<gSpot&&!atm;
    const putITM =r.k>gSpot&&!atm;
    const rc=atm?'rtc-atm-row':callITM?'rtc-call-itm':putITM?'rtc-put-itm':'';
    const callIV=r.c?calcIV(mid(r.c),gSpot,r.k,T,true,gRate):null;
    const putIV =r.p?calcIV(mid(r.p),gSpot,r.k,T,false,gRate):null;
    const callDelta=callIV!=null?bsDelta(gSpot,r.k,T,callIV,true,gRate):null;
    const putDelta =putIV!=null?bsDelta(gSpot,r.k,T,putIV,false,gRate):null;
    const cv=r.c?.last!=null&&r.c?.previous_close?(r.c.last/r.c.previous_close-1)*100:null;
    const pv=r.p?.last!=null&&r.p?.previous_close?(r.p.last/r.p.previous_close-1)*100:null;
    chartRows.push({k:r.k,callIV,putIV,callVol:r.c?.volume||0,putVol:r.p?.volume||0});
    const strikeCell=atm
      ?`<td class="rtc-td c">${fk(r.k)}<span class="rtc-atm-badge">ATM</span></td>`
      :`<td class="rtc-td c">${fk(r.k)}</td>`;
    return`<tr class="${rc}">
      <td class="rtc-td" style="text-align:center">${fCant(r.c?.bid_size)}</td>
      <td class="rtc-td bid ${fb(r.c)}">${r.c?.bid!=null?fn(r.c.bid):'—'}</td>
      <td class="rtc-td ${r.c?'rtc-clk':''} ${fl(r.c)}" ${r.c?`onclick="rtcCard('${r.c.symbol}')" title="Ver apalancamiento"`:''}>${r.c?.last!=null?fn(r.c.last):'—'}</td>
      <td class="rtc-td ask ${fa(r.c)}">${r.c?.ask!=null?fn(r.c.ask):'—'}</td>
      <td class="rtc-td" style="text-align:center">${fCant(r.c?.ask_size)}</td>
      <td class="rtc-td iv">${callIV!=null?Math.round(callIV*100)+'%':'—'}</td>
      <td class="rtc-td" style="text-align:center">${fDelta(callDelta)}</td>
      <td class="rtc-td">${fLev(r.c,callDelta)}</td>
      <td class="rtc-td">${varBadge(cv)}</td>
      ${strikeCell}
      <td class="rtc-td" style="text-align:center">${fCant(r.p?.bid_size)}</td>
      <td class="rtc-td bid ${fb(r.p)}">${r.p?.bid!=null?fn(r.p.bid):'—'}</td>
      <td class="rtc-td ${r.p?'rtc-clk':''} ${fl(r.p)}" ${r.p?`onclick="rtcCard('${r.p.symbol}')" title="Ver apalancamiento"`:''}>${r.p?.last!=null?fn(r.p.last):'—'}</td>
      <td class="rtc-td ask ${fa(r.p)}">${r.p?.ask!=null?fn(r.p.ask):'—'}</td>
      <td class="rtc-td" style="text-align:center">${fCant(r.p?.ask_size)}</td>
      <td class="rtc-td iv">${putIV!=null?Math.round(putIV*100)+'%':'—'}</td>
      <td class="rtc-td" style="text-align:center">${fDelta(putDelta)}</td>
      <td class="rtc-td">${fLev(r.p,putDelta)}</td>
      <td class="rtc-td">${varBadge(pv)}</td>
    </tr>`;
  }).join('');

  // Clear flash flags after animation
  setTimeout(()=>filt.forEach(o=>{delete o._fl;delete o._fb;delete o._fa;}),950);

  // Draw charts
  rtcDrawSmile(chartRows,atmK);
  rtcDrawVol(chartRows,atmK);
};

// ── Charts ────────────────────────────────────────────────────
const CW=600,CH=200,PL=44,PR=14,PT=18,PB=28;
const ccW=CW-PL-PR,ccH=CH-PT-PB;

function rtcDrawSmile(rows,atmK){
  const el=document.getElementById('rtcSmileSvg');
  if(!el)return;
  // Solo strikes cerca del ATM (0.65x – 1.55x spot) con IV razonable (5%–250%)
  const spFilt=gSpot?rows.filter(r=>r.k>=gSpot*0.65&&r.k<=gSpot*1.55):rows;
  const validC=spFilt.filter(r=>r.callIV!=null&&r.callIV>=0.05&&r.callIV<=2.5);
  const validP=spFilt.filter(r=>r.putIV!=null&&r.putIV>=0.05&&r.putIV<=2.5);
  const allIV=[...validC.map(r=>r.callIV),...validP.map(r=>r.putIV)];
  if(!allIV.length){el.innerHTML=`<text x="300" y="100" text-anchor="middle" style="font-family:IBM Plex Mono,monospace;font-size:10px;fill:rgba(200,218,240,.3)">Sin datos de IV</text>`;return;}

  const allK=[...new Set([...validC.map(r=>r.k),...validP.map(r=>r.k)])].sort((a,b)=>a-b);
  const xMin=allK[0],xMax=allK[allK.length-1];
  // Percentile 5–95 para el eje Y (descarta outliers extremos)
  const sorted=[...allIV].sort((a,b)=>a-b);
  const p05=sorted[Math.floor(sorted.length*0.05)]??sorted[0];
  const p95=sorted[Math.floor(sorted.length*0.95)]??sorted[sorted.length-1];
  const yMin=Math.max(0,p05*0.88);
  const yMax=p95*1.14;
  const xS=v=>PL+((v-xMin)/(xMax-xMin||1))*ccW;
  const yS=v=>PT+ccH-((Math.min(Math.max(v,yMin),yMax)-yMin)/(yMax-yMin||0.01))*ccH;

  // Grid
  let grid='';
  for(let i=0;i<=4;i++){
    const yv=yMin+(yMax-yMin)/4*i;
    const y=yS(yv).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${CW-PR}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    grid+=`<text x="${PL-4}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-family:'IBM Plex Mono',monospace;font-size:8px;fill:rgba(200,218,240,.4)">${Math.round(yv*100)}%</text>`;
  }

  // X labels
  let xLabels='';
  const step=Math.max(1,Math.round(allK.length/7));
  allK.forEach((k,i)=>{
    if(i%step===0||k===atmK)
      xLabels+=`<text x="${xS(k).toFixed(1)}" y="${CH-PB+14}" text-anchor="middle" style="font-family:'IBM Plex Mono',monospace;font-size:7.5px;fill:rgba(200,218,240,.4)">${fn(k,1)}</text>`;
  });

  // ATM
  let atmLine='';
  if(atmK&&atmK>=xMin&&atmK<=xMax){
    const ax=xS(atmK).toFixed(1);
    atmLine=`<line x1="${ax}" y1="${PT}" x2="${ax}" y2="${CH-PB}" stroke="rgba(251,191,36,.5)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="${ax}" y="${PT-5}" text-anchor="middle" style="font-family:'IBM Plex Mono',monospace;font-size:7px;fill:rgba(251,191,36,.7)">ATM</text>`;
  }

  // Shaded area under call smile
  let callFill='';
  if(validC.length>1){
    const pts=validC.map(r=>xS(r.k).toFixed(1)+','+yS(r.callIV).toFixed(1)).join(' ');
    const x0=xS(validC[0].k).toFixed(1),xn=xS(validC[validC.length-1].k).toFixed(1),yB=(CH-PB).toFixed(1);
    callFill=`<polygon points="${pts} ${xn},${yB} ${x0},${yB}" fill="rgba(0,229,168,.07)"/>`;
  }
  let putFill='';
  if(validP.length>1){
    const pts=validP.map(r=>xS(r.k).toFixed(1)+','+yS(r.putIV).toFixed(1)).join(' ');
    const x0=xS(validP[0].k).toFixed(1),xn=xS(validP[validP.length-1].k).toFixed(1),yB=(CH-PB).toFixed(1);
    putFill=`<polygon points="${pts} ${xn},${yB} ${x0},${yB}" fill="rgba(255,63,94,.07)"/>`;
  }

  // Lines
  const callLine=validC.length>1?`<path d="${validC.map((r,i)=>(i?'L':'M')+xS(r.k).toFixed(1)+','+yS(r.callIV).toFixed(1)).join(' ')}" stroke="rgba(0,229,168,.9)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>`:'' ;
  const putLine =validP.length>1?`<path d="${validP.map((r,i)=>(i?'L':'M')+xS(r.k).toFixed(1)+','+yS(r.putIV).toFixed(1)).join(' ')}" stroke="rgba(255,63,94,.9)"  stroke-width="1.8" fill="none" stroke-linejoin="round"/>`:'' ;

  // Dots with tooltip
  const callDots=validC.map(r=>`<circle cx="${xS(r.k).toFixed(1)}" cy="${yS(r.callIV).toFixed(1)}" r="3" fill="rgba(0,229,168,.9)" style="cursor:default"><title>K=${fn(r.k,1)}  CALL IV=${Math.round(r.callIV*100)}%</title></circle>`).join('');
  const putDots =validP.map(r=>`<circle cx="${xS(r.k).toFixed(1)}" cy="${yS(r.putIV).toFixed(1)}"  r="3" fill="rgba(255,63,94,.9)"  style="cursor:default"><title>K=${fn(r.k,1)}  PUT IV=${Math.round(r.putIV*100)}%</title></circle>`).join('');

  const axes=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${CH-PB}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
  <line x1="${PL}" y1="${CH-PB}" x2="${CW-PR}" y2="${CH-PB}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;

  el.innerHTML=`${grid}${atmLine}${axes}${callFill}${putFill}${callLine}${putLine}${callDots}${putDots}${xLabels}`;
}

function rtcDrawVol(rows,atmK){
  const el=document.getElementById('rtcVolSvg');
  if(!el)return;
  const withVol=rows.filter(r=>(r.callVol||0)>0||(r.putVol||0)>0);
  if(!withVol.length){
    el.innerHTML=`<text x="300" y="100" text-anchor="middle" style="font-family:'IBM Plex Mono',monospace;font-size:10px;fill:rgba(200,218,240,.3)">Sin datos de volumen</text>`;return;
  }

  const xMin=withVol[0].k,xMax=withVol[withVol.length-1].k;
  const maxVol=Math.max(...withVol.map(r=>(r.callVol||0)+(r.putVol||0)),1);
  const xS=v=>PL+((v-xMin)/(xMax-xMin||1))*ccW;
  const yS=v=>PT+ccH-(v/maxVol)*ccH;
  const halfBar=Math.min(ccW/(withVol.length*2.8),14);

  // Grid + y-axis labels
  let grid='';
  [0,0.25,0.5,0.75,1].forEach(pct=>{
    const y=(PT+ccH-pct*ccH).toFixed(1);
    const v=Math.round(maxVol*pct);
    grid+=`<line x1="${PL}" y1="${y}" x2="${CW-PR}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    if(pct>0)grid+=`<text x="${PL-4}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-family:'IBM Plex Mono',monospace;font-size:8px;fill:rgba(200,218,240,.4)">${fvol(v)}</text>`;
  });

  // ATM
  let atmLine='';
  if(atmK){
    const ax=xS(atmK).toFixed(1);
    atmLine=`<line x1="${ax}" y1="${PT}" x2="${ax}" y2="${CH-PB}" stroke="rgba(251,191,36,.4)" stroke-width="1" stroke-dasharray="4,3"/>`;
  }

  // Bars + x labels
  let bars='',xLabels='';
  const labelStep=Math.max(1,Math.round(withVol.length/7));
  withVol.forEach((r,i)=>{
    const cx=xS(r.k);
    const cv=r.callVol||0,pv=r.putVol||0;
    const bH_c=(cv/maxVol)*ccH,bH_p=(pv/maxVol)*ccH;
    const bw=(halfBar-1).toFixed(1);
    if(cv>0) bars+=`<rect x="${(cx-halfBar).toFixed(1)}" y="${(PT+ccH-bH_c).toFixed(1)}" width="${bw}" height="${bH_c.toFixed(1)}" fill="rgba(0,229,168,.65)" rx="1" style="cursor:default"><title>K=${fn(r.k,1)}  CALL vol=${fvol(cv)}</title></rect>`;
    if(pv>0) bars+=`<rect x="${(cx+1).toFixed(1)}" y="${(PT+ccH-bH_p).toFixed(1)}" width="${bw}" height="${bH_p.toFixed(1)}" fill="rgba(255,63,94,.65)" rx="1" style="cursor:default"><title>K=${fn(r.k,1)}  PUT vol=${fvol(pv)}</title></rect>`;
    if(i%labelStep===0||r.k===atmK){
      xLabels+=`<text x="${cx.toFixed(1)}" y="${CH-PB+14}" text-anchor="middle" style="font-family:'IBM Plex Mono',monospace;font-size:7.5px;fill:rgba(200,218,240,.4)">${fn(r.k,1)}</text>`;
    }
  });

  const axes=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${CH-PB}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
  <line x1="${PL}" y1="${CH-PB}" x2="${CW-PR}" y2="${CH-PB}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;

  el.innerHTML=`${grid}${atmLine}${axes}${bars}${xLabels}`;
}

// ── Card de apalancamiento (prima vs spot) ────────────────────
window.rtcCardClose=()=>{const o=document.getElementById('rtcCardOv');if(o)o.classList.remove('on');};
window.rtcCard=(symbol)=>{
  const o=gOpts.find(x=>x.symbol===symbol);
  const ov=document.getElementById('rtcCardOv');
  if(!o||!gSpot||!ov)return;
  const box=ov.querySelector('.rtc-card');
  const isC=o.kind==='CALL',K=o.strike;
  const dte=Math.ceil((new Date(o.expiration)-new Date())/86400000);
  const T=Math.max((new Date(o.expiration)-new Date())/(365*86400000),1/365);
  const m=mid(o);
  const hd=`<div class="rtc-card-hd"><div>
      <div class="rtc-card-ttl">El apalancamiento de ${o.symbol}</div>
      <div class="rtc-card-sub">${isC?'CALL':'PUT'} · Strike $${fn(K)} · Vto ${o.expiration.slice(0,10)} (${dte}d) · GGAL $${fn(gSpot)}</div>
    </div><button class="rtc-card-x" onclick="rtcCardClose()">✕ Cerrar</button></div>`;
  if(m==null||m<=0){box.innerHTML=hd+`<div class="rtc-card-note">Sin precio (bid/ask/last) para calcular la curva.</div>`;ov.classList.add('on');return;}
  const iv=calcIV(m,gSpot,K,T,isC,gRate);
  const delta=iv!=null?bsDelta(gSpot,K,T,iv,isC,gRate):null;
  const intr=Math.max(isC?gSpot-K:K-gSpot,0);
  const be=isC?K+m:K-m;
  const lev=delta!=null?Math.abs(delta)*gSpot/m:null;
  const intrPct=m>0?intr/m*100:0;

  // Escenarios (mismos ratios que la referencia): calls al alza, puts a la baja
  const mults=isC?[0.95,1,1.0625,1.125,1.25,1.375,1.5]:[1.05,1,0.9375,0.875,0.75,0.625,0.5];
  const px=(S)=>iv!=null?bsV(S,K,T,iv,isC,gRate):Math.max(isC?S-K:K-S,0);
  const scen=mults.map(f=>{const S=gSpot*f,pN=px(S);return{S,pN,pct:m>0?(pN/m-1)*100:0,cur:Math.abs(f-1)<1e-9};});

  // Curva muestreada
  const xMin=Math.min(...scen.map(s=>s.S)),xMax=Math.max(...scen.map(s=>s.S));
  const N=64,xs=[];
  for(let i=0;i<=N;i++){const S=xMin+(xMax-xMin)*i/N;xs.push({S,now:px(S),exp:Math.max(isC?S-K:K-S,0)});}
  const yMax=Math.max(...xs.map(p=>p.now),m)*1.12||1;

  const W=680,H=360,PL=62,PR=20,PT=20,PB=42,cw=W-PL-PR,ch=H-PT-PB;
  const xS=v=>PL+((v-xMin)/(xMax-xMin||1))*cw;
  const yS=v=>PT+ch-(Math.min(v,yMax)/yMax)*ch;

  let grid='';
  for(let i=0;i<=4;i++){const yv=yMax/4*i,y=yS(yv).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`;
    grid+=`<text x="${PL-5}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-size:8px;fill:rgba(200,218,240,.45)">$${fn(yv)}</text>`;}
  let xlab='';
  scen.forEach(sc=>{xlab+=`<text x="${xS(sc.S).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" style="font-size:8px;fill:rgba(200,218,240,.5)">${fn(sc.S)}</text>`;});

  const pathNow=xs.map((p,i)=>(i?'L':'M')+xS(p.S).toFixed(1)+','+yS(p.now).toFixed(1)).join(' ');
  const pathExp=xs.map((p,i)=>(i?'L':'M')+xS(p.S).toFixed(1)+','+yS(p.exp).toFixed(1)).join(' ');
  const area=xs.map(p=>xS(p.S).toFixed(1)+','+yS(p.now).toFixed(1)).join(' ')+' '+xs.slice().reverse().map(p=>xS(p.S).toFixed(1)+','+yS(p.exp).toFixed(1)).join(' ');
  const spotLine=`<line x1="${xS(gSpot).toFixed(1)}" y1="${PT}" x2="${xS(gSpot).toFixed(1)}" y2="${H-PB}" stroke="rgba(251,191,36,.55)" stroke-width="1" stroke-dasharray="4,3"/>`;
  const dots=scen.map(sc=>{const x=xS(sc.S).toFixed(1),y=yS(sc.pN).toFixed(1);
    const lab=sc.cur?`$${fn(sc.pN)} · actual`:`$${fn(sc.pN)} · ${sc.pct>=0?'+':''}${Math.round(sc.pct)}%`;
    const anchor=sc.S>=(xMin+xMax)/2?'end':'start',dx=sc.S>=(xMin+xMax)/2?-7:7;
    const tip=sc.cur?`GGAL hoy $${fn(sc.S)} → prima $${fn(sc.pN)} (precio actual)`:`Si GGAL va a $${fn(sc.S)}, la opción valdría $${fn(sc.pN)} (${sc.pct>=0?'+':''}${Math.round(sc.pct)}% vs la prima de hoy)`;
    return`<circle cx="${x}" cy="${y}" r="3.2" fill="${sc.cur?'var(--amber)':'var(--green)'}"><title>${tip}</title></circle>`+
      `<text x="${(+x+dx).toFixed(1)}" y="${(+y-7).toFixed(1)}" text-anchor="${anchor}" style="font-size:9px;font-weight:700;fill:${sc.cur?'var(--amber)':'#d7f5ea'}">${lab}</text>`;}).join('');
  const axes=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="rgba(255,255,255,.12)"/><line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="rgba(255,255,255,.12)"/>`;

  const svg=`<svg class="rtc-card-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${grid}<g><title>GGAL hoy: $${fn(gSpot)}</title>${spotLine}</g>${axes}
    <polygon points="${area}" fill="rgba(0,229,168,.10)"><title>Valor tiempo + financiamiento: la brecha entre la prima de hoy y el valor al vencimiento. Es lo que se derrite si GGAL no se mueve hasta el ${o.expiration.slice(0,10)}.</title></polygon>
    <path d="${pathExp}" stroke="rgba(200,218,240,.45)" stroke-width="1.6" stroke-dasharray="7,5" fill="none"><title>Valor al vencimiento (${o.expiration.slice(0,10)}): lo que vale la opción el día del vto = solo valor intrínseco, máx(${isC?'GGAL−strike':'strike−GGAL'}, 0).</title></path>
    <path d="${pathNow}" stroke="var(--green)" stroke-width="2.2" fill="none" stroke-linejoin="round"><title>Prima estimada si GGAL se mueve AHORA (mismo vto, IV ${iv!=null?Math.round(iv*100)+'%':'—'}): reprecia la opción manteniendo el valor tiempo.</title></path>
    ${dots}${xlab}
    <text x="${PL-52}" y="${PT+ch/2}" transform="rotate(-90 ${PL-52} ${PT+ch/2})" text-anchor="middle" style="font-size:9px;fill:rgba(200,218,240,.45)">Valor de la prima</text>
    <text x="${PL+cw/2}" y="${H-4}" text-anchor="middle" style="font-size:9px;fill:rgba(200,218,240,.45)">Precio de GGAL</text>
  </svg>`;

  const stats=`<div class="rtc-card-stats">
    <div class="rtc-stat" title="Precio medio bid/ask que pagás por la opción."><b>$${fn(m)}</b><span>Prima (mid)</span></div>
    <div class="rtc-stat" title="Palanca efectiva (omega) = |Δ|·Spot/Prima. Cuánto se mueve la opción, en %, por cada 1% que se mueve GGAL. Más alta = más potencia y más riesgo."><b>${lev!=null?lev.toFixed(1)+'x':'—'}</b><span>Palanca ef.</span></div>
    <div class="rtc-stat" title="Precio de GGAL al que no ganás ni perdés al vencimiento = strike ${isC?'+':'−'} prima = $${fn(be)}."><b>$${fn(be)}</b><span>Equilibrio</span></div>
    <div class="rtc-stat" title="Qué parte de la prima ya es valor real hoy (${isC?'GGAL−strike':'strike−GGAL'}). El resto (${100-Math.round(intrPct)}%) es valor tiempo que se derrite."><b>${Math.round(intrPct)}%</b><span>Intrínseco</span></div>
    <div class="rtc-stat" title="Volatilidad implícita: la vol anual que el mercado le está pagando a esta opción (calibrada desde la prima)."><b>${iv!=null?Math.round(iv*100)+'%':'—'}</b><span>IV</span></div>
    <div class="rtc-stat" title="Delta: cuántas acciones de GGAL equivale la opción (0 a 1 para call). Sensibilidad de la prima al precio de GGAL."><b>${delta!=null?delta.toFixed(2):'—'}</b><span>Delta</span></div>
  </div>`;
  const legend=`<div class="rtc-card-lg">
    <span style="color:var(--green)" title="Reprecia la opción si GGAL se mueve hoy mismo, manteniendo el valor tiempo (mismo vto, misma IV).">━ Prima si GGAL se mueve ahora</span>
    <span title="Lo que vale la opción el día del vencimiento: solo valor intrínseco.">┄ Valor al vencimiento (${o.expiration.slice(0,10)})</span>
    <span style="color:var(--amber)" title="Precio actual de GGAL.">┆ GGAL hoy $${fn(gSpot)}</span></div>`;
  const hint=`<div class="rtc-card-note">💡 Pasá el cursor sobre las líneas, los puntos y los recuadros de arriba para ver qué significa cada uno.</div>`;
  const note=iv==null?`<div class="rtc-card-note">⚠ No se pudo calibrar IV (opción ilíquida o prima fuera de rango): la curva "ahora" cae al valor intrínseco.</div>`:'';
  box.innerHTML=hd+stats+legend+svg+hint+note;
  ov.classList.add('on');
};

// ── Init ──────────────────────────────────────────────────────
rtcLoad();
if(gTimer)clearInterval(gTimer);
gTimer=setInterval(rtcLoad,30000);

})();
</script>
