<!-- Módulo Arbitraje / Costo — reversión a la media del costo de estructuras de opciones -->
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px">
  <div>
    <div class="sec-label">Arbitraje · Costo / Reversión</div>
    <div style="font-size:12px;color:var(--text3)">Costo de armar cada estructura vs su media. Barato = armar · Caro = desarmar.</div>
  </div>
  <select id="arbSel" onchange="arbRender()" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer"></select>
</div>

<!-- Tarjeta de acción -->
<div id="arbAction" style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:10px 0"></div>

<!-- Diario -->
<div class="card" style="margin-bottom:12px">
  <div class="card-head"><span class="card-title">Diario (EOD)</span><span id="arbDailyMeta" style="font-size:11px;color:var(--text3)"></span></div>
  <div class="card-body"><div id="arbDailyChart" style="height:280px;width:100%"></div></div>
</div>

<!-- Intra 5m -->
<div class="card">
  <div class="card-head">
    <span class="card-title">Intradía 5m (hoy)</span>
    <div style="display:flex;gap:4px">
      <button class="arb-mode active" data-mode="mid"    onclick="arbSetMode('mid',this)">Mid</button>
      <button class="arb-mode"        data-mode="last"   onclick="arbSetMode('last',this)">Last</button>
      <button class="arb-mode"        data-mode="puntas" onclick="arbSetMode('puntas',this)">Puntas</button>
    </div>
  </div>
  <div class="card-body"><div id="arbIntraChart" style="height:260px;width:100%"></div></div>
</div>

<style>
.arb-mode{background:var(--card-bg);color:var(--text3);border:1px solid var(--border);border-radius:5px;padding:3px 12px;font-size:12px;cursor:pointer;transition:all .12s}
.arb-mode.active{background:var(--accent,#00e5a8);color:#04120c;border-color:transparent;font-weight:700}
.arb-flagcard{flex:1;min-width:220px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
</style>

<script>
(function(){
  let _rows = {}, _cur = null, _mode = 'mid', _chD = null, _chI = null;
  const C = { bull:'#00e5a8', bear:'#ff3f5e', neu:'#8899aa', mean:'#f5a623', line:'#a78bfa' };

  function loadApex(){ return new Promise(res=>{ if(window.ApexCharts){res();return;}
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js';
    s.onload=res; s.onerror=res; document.head.appendChild(s); }); }

  const flagCol = f => f==='barato'?C.bull : f==='caro'?C.bear : C.neu;
  const fmt = v => v==null?'—':Math.round(v).toLocaleString('es-AR');

  window.arbSetMode = (m,btn)=>{ _mode=m;
    document.querySelectorAll('.arb-mode').forEach(b=>b.classList.remove('active'));
    if(btn)btn.classList.add('active'); drawAction(_cur); drawDaily(_cur); drawIntra(); };

  function drawAction(r){
    const st = r.state[_mode] || r.state.mid;
    const col = flagCol(st.flag);
    const legs = st.flag==='caro' ? r.desarmar : r.armar;
    const legLabel = st.flag==='caro' ? 'DESARMAR' : (st.flag==='barato'?'ARMAR':'—');
    // crédito vs débito: costo<0 = te pagan (crédito), >0 = pagás (débito)
    const cost = st.cost;
    const isCred = cost!=null && cost<0;
    const cdCol = isCred?C.bull:C.bear;
    const cdTxt = cost==null?'—':(isCred?`CRÉDITO ${fmt(-cost)} · te PAGAN para armar`:`DÉBITO ${fmt(cost)} · PAGÁS para armar`);
    document.getElementById('arbAction').innerHTML = `
      <div class="arb-flagcard" style="border-color:${col}55">
        <div style="font-size:11px;color:var(--text3)">Estado (${_mode})</div>
        <div style="font-size:22px;font-weight:800;color:${col}">${(st.flag||'').toUpperCase()} · ${st.accion||''}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px">z = ${st.z==null?'—':st.z.toFixed(2)} · costo ${fmt(st.cost)} · media ${fmt(st.mean)}</div>
      </div>
      <div class="arb-flagcard" style="border-color:${cdCol}55">
        <div style="font-size:11px;color:var(--text3)">Caja (armar ahora)</div>
        <div style="font-size:17px;font-weight:800;color:${cdCol};margin-top:2px">${cdTxt}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px">Costo &lt; 0 = crédito (cobrás) · &gt; 0 = débito (pagás)</div>
      </div>
      <div class="arb-flagcard" style="border-color:${col}55">
        <div style="font-size:11px;color:var(--text3)">Qué hacer</div>
        <div style="font-size:15px;font-weight:700;color:${col};margin:2px 0">${legLabel}: ${legs||'—'}</div>
        <div style="font-size:12px;color:var(--text3)">${st.hint||''}</div>
      </div>`;
  }

  function baseOpts(pts, st, h, xfmt){
    const yl=[], pl=[];
    if(st && st.mean!=null){
      yl.push({y:st.mean, borderColor:C.mean, strokeDashArray:6, label:{text:'media '+fmt(st.mean), style:{color:'#fff',background:C.mean,fontSize:'10px'}}});
      if(st.sd){
        yl.push({y:st.mean+st.sd, borderColor:C.bear, strokeDashArray:3, label:{text:'+1σ caro', style:{color:'#fff',background:C.bear,fontSize:'10px'}}});
        yl.push({y:st.mean-st.sd, borderColor:C.bull, strokeDashArray:3, label:{text:'-1σ barato', style:{color:'#04120c',background:C.bull,fontSize:'10px'}}});
      }
    }
    // marcadores máx / mín / actual (como la captura)
    if(pts.length){
      const mx=pts.reduce((a,b)=>b.y>a.y?b:a), mn=pts.reduce((a,b)=>b.y<a.y?b:a), lc=pts[pts.length-1];
      const mk=(p,col,txt)=>({x:p.x,y:p.y,marker:{size:6,fillColor:col,strokeColor:'#fff',strokeWidth:1},label:{text:txt+' '+fmt(p.y),borderColor:col,style:{color:'#fff',background:col,fontSize:'10px'}}});
      pl.push(mk(mx,C.bear,''), mk(mn,C.line,''), mk(lc,C.bull,''));
    }
    return {
      chart:{ type:'area', height:h, background:'transparent', animations:{enabled:false},
        toolbar:{show:true, tools:{download:false,selection:true,zoom:true,zoomin:true,zoomout:true,pan:true,reset:true}}, zoom:{enabled:true,type:'x'} },
      theme:{mode:'dark'},
      series:[{name:'Costo', data:pts}],
      colors:[C.line],
      stroke:{ curve:'smooth', width:3 },
      fill:{ type:'gradient', gradient:{shadeIntensity:1, opacityFrom:0.28, opacityTo:0.02} },
      dataLabels:{enabled:false}, markers:{size:0},
      grid:{ borderColor:'#1e2530', strokeDashArray:2 },
      xaxis:{ type:'datetime', labels:{style:{colors:'#8899aa'}, datetimeFormatter:xfmt}, tooltip:{enabled:false} },
      yaxis:{ labels:{style:{colors:'#8899aa'}, formatter:fmt} },
      annotations:{ yaxis:yl, points:pl },
      tooltip:{ theme:'dark', x:{format: xfmt==='intra'?'HH:mm':'dd MMM'} },
    };
  }

  function drawDaily(r){
    const el=document.getElementById('arbDailyChart');
    if(_chD){_chD.destroy();_chD=null;} el.innerHTML='';
    if(!r||!r.daily?.length) return;
    const pts=r.daily.filter(d=>d[_mode]!=null).map(d=>({x:new Date(d.d).getTime(), y:d[_mode]}));
    const st=r.state[_mode]||r.state.mid;
    _chD=new ApexCharts(el, baseOpts(pts, st, 280, {day:'dd MMM'})); _chD.render();
    document.getElementById('arbDailyMeta').textContent = `${r.label} · ${r.expiration} · CoV ${r.cov}% · ${r.daily.length} días`;
  }

  function drawIntra(){
    const r=_cur; const el=document.getElementById('arbIntraChart');
    if(_chI){_chI.destroy();_chI=null;} el.innerHTML='';
    if(!r||!r.intraday?.length){ el.innerHTML='<div style="color:var(--text3);padding:20px;font-size:13px">Sin datos intradía de hoy todavía.</div>'; return; }
    const today = (r.daily?.length? r.daily[r.daily.length-1].d : new Date().toISOString().slice(0,10));
    // captured_at ya es hora ART (GMT-3); ApexCharts formatea el eje en UTC, así que parseo como UTC (append Z) para mostrar el HH:MM verbatim
    const pts=r.intraday.filter(x=>x[_mode]!=null).map(x=>({x:new Date(today+'T'+x.ts+':00Z').getTime(), y:x[_mode]}));
    const st=r.state[_mode]||r.state.mid;
    const o=baseOpts(pts, st, 260, {hour:'HH:mm',minute:'HH:mm'}); o.tooltip.x.format='HH:mm';
    _chI=new ApexCharts(el, o); _chI.render();
  }

  window.arbRender = ()=>{
    _cur = _rows[document.getElementById('arbSel').value]; if(!_cur) return;
    drawAction(_cur); drawDaily(_cur); drawIntra();
  };

  window.arbInit = async ()=>{
    await loadApex();
    let data=[];
    try{ data = await sb('arb_cost','select=*&order=cov.desc'); }catch(e){}
    if(!data.length){ document.getElementById('arbAction').innerHTML='<div style="color:var(--text3)">Sin estructuras publicadas todavía.</div>'; return; }
    _rows={}; const sel=document.getElementById('arbSel'); sel.innerHTML='';
    data.forEach(r=>{ _rows[r.structure]=r;
      const o=document.createElement('option'); o.value=r.structure;
      const st=r.state?.mid||{}; o.textContent=`${r.label}  (${(st.flag||'').toUpperCase()})`;
      sel.appendChild(o); });
    sel.value = data[0].structure;
    arbRender();
  };

  arbInit();
})();
</script>
