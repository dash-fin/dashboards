<!-- ══════════════════════════════════════════════
     MÓDULO: SEÑALES / ESTRATEGIAS — Opciones GGAL
     Calculadas desde opciones_rt (cadena RT)
     Estrategias: Bull Spread, Bear Spread, Naked Put,
                  Bull Spread +1, Bear Spread +1
══════════════════════════════════════════════ -->
<style>
.anl-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;flex-wrap:wrap;gap:8px}
.anl-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.anl-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3)}
.anl-toggle{display:flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden}
.anl-tbtn{padding:5px 16px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;background:transparent;color:var(--text3);border:none;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.anl-tbtn.active{background:var(--green);color:#000}
.anl-esel{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:4px;padding:5px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;outline:none}
.anl-spot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3)}
.anl-spot b{color:var(--green);font-weight:500}
.anl-right{display:flex;align-items:center;gap:8px}
.anl-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text3)}
.anl-rbtn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:4px;padding:4px 10px;font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer}
.anl-section{margin-top:14px}
.anl-sec-hdr{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:8px}
.anl-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:960px){.anl-grid2{grid-template-columns:1fr}}
.anl-card{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.anl-card-hdr{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg3)}
.anl-card-title{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.anl-card-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text3)}
.anl-table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace}
.anl-th{font-size:7px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:5px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.anl-th.l{text-align:left}
.anl-td{font-size:10px;color:var(--text);padding:5px 10px;text-align:right;border-bottom:1px solid rgba(30,37,48,.5)}
.anl-td.l{text-align:left;color:var(--text2);font-size:9px}
.anl-tr:last-child .anl-td{border-bottom:none}
.anl-tr:hover .anl-td{background:rgba(255,255,255,.02)}
.c-costo{color:var(--red)}
.c-win{color:var(--green)}
.c-rr{color:var(--green)}
.c-be{color:var(--text2)}
.c-prob-lo{color:var(--green)}
.c-prob-md{color:var(--amber)}
.c-prob-hi{color:var(--red)}
.c-tna-bid{color:var(--green)}
.c-tna-offer{color:var(--red)}
.c-tna-pos{color:var(--green)}
.c-tna-neg{color:var(--red)}
.anl-note{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text3);padding:6px 12px;background:rgba(255,255,255,.015);border-top:1px solid var(--border)}
.anl-empty{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);text-align:center;padding:20px}
</style>

<div id="anlWrap" style="padding-bottom:30px">
  <div class="anl-header">
    <div class="anl-left">
      <span class="anl-label">Precio:</span>
      <div class="anl-toggle">
        <button class="anl-tbtn active" onclick="anlMode('last',this)">Last</button>
        <button class="anl-tbtn"        onclick="anlMode('puntas',this)">Por puntas</button>
      </div>
      <select class="anl-esel" id="anlExp" onchange="anlRender()"></select>
      <span class="anl-spot">GGAL <b id="anlSpotVal">—</b></span>
      <span class="anl-meta" id="anlAtmIV" style="color:var(--purple)"></span>
    </div>
    <div class="anl-right">
      <span class="anl-meta" id="anlUpd"></span>
      <button class="anl-rbtn" onclick="anlLoad()">↻</button>
    </div>
  </div>
  <div id="anlBody"><div class="anl-empty">Cargando estrategias...</div></div>
</div>

<script>
(function(){

// ── Black-Scholes IV (Newton-Raphson) ─────────────────────────
const normCDF=z=>{const t=1/(1+0.2316419*Math.abs(z));const p=t*(0.31938153+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));const c=1-Math.exp(-0.5*z*z)/2.506628274590452*p;return z>=0?c:1-c};
const bsV=(S,K,T,s,isC)=>{if(T<=0||s<=0)return Math.max(isC?S-K:K-S,0);const q=Math.sqrt(T),d1=(Math.log(S/K)+0.5*s*s*T)/(s*q),d2=d1-s*q;return isC?S*normCDF(d1)-K*normCDF(d2):K*normCDF(-d2)-S*normCDF(-d1)};
const calcIV=(price,S,K,T,isC)=>{if(!price||price<=0||T<=0||S<=0||K<=0)return null;if(price<Math.max(isC?S-K:K-S,0)-1)return null;let s=0.5;for(let i=0;i<60;i++){const q=Math.sqrt(T),d1=(Math.log(S/K)+0.5*s*s*T)/(s*q);const vg=S*q*Math.exp(-0.5*d1*d1)/2.506628274590452;if(vg<1e-8)break;const df=bsV(S,K,T,s,isC)-price;if(Math.abs(df)<0.05)break;s-=df/vg;if(s<=0.001){s=0.001;break;}if(s>15)return null}return s>0.001&&s<15?s:null};
// P(S_T > K) — prob de que el subyacente termine arriba del strike
const probAbove=(S,K,T,s)=>{if(!s||T<=0||S<=0||K<=0)return null;const d2=(Math.log(S/K)-0.5*s*s*T)/(s*Math.sqrt(T));return normCDF(d2)*100};

// ── Formatters ────────────────────────────────────────────────
const fn=(n,d=2)=>{if(n==null||isNaN(n))return'—';const abs=Math.abs(n).toFixed(d).split('.');abs[0]=abs[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'-':'')+abs.join(',')};
const fk=n=>fn(n,1);
const fp=n=>fn(n,2);
const mid=o=>o.bid!=null&&o.ask!=null?(o.bid+o.ask)/2:(o.last??o.ask??o.bid??null);

// ── Config ────────────────────────────────────────────────────
const SBR='https://endymbpdayeidromxayb.supabase.co/rest/v1/';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuZHltYnBkYXllaWRyb214YXliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MzU4NTAsImV4cCI6MjA4OTExMTg1MH0.BCZRvE9F1g_w2ffwj6NA6vyCYab2XcHDgmZir3CkeOk';
const sbF=(t,p)=>fetch(SBR+t+'?'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}).then(r=>r.ok?r.json():[]);

let gSpot=null, gOpts=[], gPriceMode='last', gAtmIV=0.4, gTimer=null;

window.anlMode=(m,btn)=>{
  gPriceMode=m;
  document.querySelectorAll('.anl-tbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  anlRender();
};

const px=o=>{if(!o)return null;return gPriceMode==='last'?(o.last??null):mid(o)};

// ── Load ──────────────────────────────────────────────────────
window.anlLoad=async()=>{
  try{
    const today=new Date().toISOString().slice(0,10);
    const[sR,oR]=await Promise.all([
      sbF('mercado','symbol=eq.GGAL&settlement=eq.24hs&select=last,change&limit=1'),
      sbF('opciones_rt','underlying_asset=ilike.GGAL*&select=symbol,kind,strike,expiration,last,bid,ask,previous_close&order=expiration.asc,strike.asc&limit=500')
    ]);
    if(sR?.length){gSpot=sR[0].last;document.getElementById('anlSpotVal').textContent='$'+fn(gSpot,0)}
    gOpts=(Array.isArray(oR)?oR:[]).filter(o=>o.expiration>=today);
    const exps=[...new Set(gOpts.map(o=>o.expiration.slice(0,10)))].sort();
    const sel=document.getElementById('anlExp');const cur=sel.value;
    sel.innerHTML=exps.map(e=>{const d=Math.ceil((new Date(e)-new Date())/86400000);return`<option value="${e}">${e} (${d}d)</option>`}).join('');
    if(cur&&exps.includes(cur))sel.value=cur;
    const now=new Date();
    document.getElementById('anlUpd').textContent='Act. '+[now.getHours(),now.getMinutes()].map(v=>String(v).padStart(2,'0')).join(':');
    anlRender();
  }catch(e){console.error('[analisis]',e);}
};

// ── Render ────────────────────────────────────────────────────
window.anlRender=()=>{
  const body=document.getElementById('anlBody');
  if(!gSpot||!gOpts.length){body.innerHTML='<div class="anl-empty">Sin datos — verificar conexión</div>';return}
  const expVal=document.getElementById('anlExp').value;if(!expVal)return;
  const days=Math.max(Math.ceil((new Date(expVal)-new Date())/86400000),1);
  const T=days/365;
  const filt=gOpts.filter(o=>o.expiration.slice(0,10)===expVal);

  // Agrupar por strike y calcular IV
  const byK=new Map();
  filt.forEach(o=>{if(!byK.has(o.strike))byK.set(o.strike,{k:o.strike,c:null,p:null});const r=byK.get(o.strike);if(o.kind==='CALL')r.c=o;else if(o.kind==='PUT')r.p=o});
  const rows=[...byK.values()].sort((a,b)=>a.k-b.k);
  rows.forEach(r=>{
    r.cIV=r.c?calcIV(mid(r.c),gSpot,r.k,T,true):null;
    r.pIV=r.p?calcIV(mid(r.p),gSpot,r.k,T,false):null;
    r.iv=r.cIV??r.pIV;
  });
  // ATM IV
  const atmRow=rows.reduce((b,r)=>Math.abs(r.k-gSpot)<Math.abs(b.k-gSpot)?r:b,rows[0]);
  gAtmIV=atmRow?.iv||0.40;
  const ivEl=document.getElementById('anlAtmIV');
  if(ivEl)ivEl.textContent=atmRow?.iv?'IV ATM: '+Math.round(gAtmIV*100)+'%':'';

  const calls=rows.filter(r=>r.c);
  const puts =rows.filter(r=>r.p);

  // Bull Spread B1-B2
  const bs1=[];
  for(let i=0;i<calls.length-1;i++){
    const r1=calls[i],r2=calls[i+1];
    const p1=px(r1.c),p2=px(r2.c);if(p1==null||p2==null)continue;
    const costo=p1-p2;if(costo<=0)continue;
    const w=r2.k-r1.k;if(w<=0)continue;
    const maxWin=w-costo;if(maxWin<=0)continue;
    const be=r1.k+costo,iv=r1.iv||gAtmIV;
    const pa=probAbove(gSpot,r1.k,T,iv);
    bs1.push({lbl:`${fk(r1.k)} / ${fk(r2.k)}`,costo,maxWin,be,pLoss:pa!=null?100-pa:50,rr:maxWin/costo,pctL:costo/w*100});
  }

  // Bull Spread B1-B3
  const bs2=[];
  for(let i=0;i<calls.length-2;i++){
    const r1=calls[i],r3=calls[i+2];
    const p1=px(r1.c),p3=px(r3.c);if(p1==null||p3==null)continue;
    const costo=p1-p3;if(costo<=0)continue;
    const w=r3.k-r1.k;if(w<=0)continue;
    const maxWin=w-costo;if(maxWin<=0)continue;
    const be=r1.k+costo,iv=r1.iv||gAtmIV;
    const pa=probAbove(gSpot,r1.k,T,iv);
    bs2.push({lbl:`${fk(r1.k)} / ${fk(r3.k)}`,costo,maxWin,be,pLoss:pa!=null?100-pa:50,rr:maxWin/costo,pctL:costo/w*100});
  }

  // Naked Put
  const np=puts.map(r=>{
    const tnaBid  =r.p.bid !=null?(r.p.bid /r.k)*(365/days)*100:null;
    const tnaLast =r.p.last!=null?(r.p.last/r.k)*(365/days)*100:null;
    const tnaOff  =r.p.ask !=null?(r.p.ask /r.k)*(365/days)*100:null;
    const tnaNet  =tnaLast!=null?tnaLast-19.9:null;
    const probOk  =probAbove(gSpot,r.k,T,r.iv||gAtmIV);
    return{lbl:fk(r.k),tnaBid,tnaLast,tnaOff,tnaNet,cap:r.k*100,probOk};
  });

  // Bear Spread B2-B1
  const br1=[];
  for(let i=0;i<puts.length-1;i++){
    const r1=puts[i],r2=puts[i+1];
    const p1=px(r1.p),p2=px(r2.p);if(p1==null||p2==null)continue;
    const costo=p2-p1;if(costo<=0)continue;
    const w=r2.k-r1.k;if(w<=0)continue;
    const maxWin=w-costo;if(maxWin<=0)continue;
    const be=r2.k-costo,iv=r2.iv||gAtmIV;
    const pLoss=probAbove(gSpot,r2.k,T,iv)??50;
    br1.push({lbl:`${fk(r1.k)} / ${fk(r2.k)}`,costo,maxWin,be,pLoss,rr:maxWin/costo,pctL:costo/w*100});
  }

  // Bear Spread B3-B1
  const br2=[];
  for(let i=0;i<puts.length-2;i++){
    const r1=puts[i],r3=puts[i+2];
    const p1=px(r1.p),p3=px(r3.p);if(p1==null||p3==null)continue;
    const costo=p3-p1;if(costo<=0)continue;
    const w=r3.k-r1.k;if(w<=0)continue;
    const maxWin=w-costo;if(maxWin<=0)continue;
    const be=r3.k-costo,iv=r3.iv||gAtmIV;
    const pLoss=probAbove(gSpot,r3.k,T,iv)??50;
    br2.push({lbl:`${fk(r1.k)} / ${fk(r3.k)}`,costo,maxWin,be,pLoss,rr:maxWin/costo,pctL:costo/w*100});
  }

  body.innerHTML=`
    <div class="anl-section">
      <div class="anl-sec-hdr">ESTRATEGIAS CON CALLS</div>
      <div class="anl-grid2">
        ${mkSpread('Bull Spread','B1 – B2',bs1,'bull')}
        ${mkSpread('Bull Spread +1','B1 – B3',bs2,'bull')}
      </div>
    </div>
    <div class="anl-section" style="margin-top:18px">
      <div class="anl-sec-hdr">ESTRATEGIAS CON PUTS</div>
      ${mkNakedPut(np,days)}
      <div class="anl-grid2" style="margin-top:10px">
        ${mkSpread('Bear Spread','B2 – B1',br1,'bear')}
        ${mkSpread('Bear Spread +1','B3 – B1',br2,'bear')}
      </div>
    </div>`;
};

// ── Builders ──────────────────────────────────────────────────
const pc=p=>p<20?'c-prob-lo':p<55?'c-prob-md':'c-prob-hi';

function mkSpread(title,sub,rows,type){
  const note=type==='bull'
    ?'Costo = máx pérdida &nbsp;·&nbsp; BE: K1+costo &nbsp;·&nbsp; % Lleno bajo = mejor'
    :'Costo = máx pérdida &nbsp;·&nbsp; BE: K2−costo &nbsp;·&nbsp; % Lleno bajo = mejor';
  const trs=rows.length
    ?rows.map(r=>`<tr class="anl-tr">
      <td class="anl-td l">${r.lbl}</td>
      <td class="anl-td c-costo">${fp(r.costo)}</td>
      <td class="anl-td c-win">${fp(r.maxWin)}</td>
      <td class="anl-td c-be">${fp(r.be)}</td>
      <td class="anl-td ${pc(r.pLoss)}">${fn(r.pLoss,1)}%</td>
      <td class="anl-td c-rr">${fn(r.rr,2)}x</td>
      <td class="anl-td">${fn(r.pctL,1)}%</td>
    </tr>`).join('')
    :`<tr><td colspan="7" class="anl-empty">Sin datos</td></tr>`;
  return`<div class="anl-card">
    <div class="anl-card-hdr">
      <span class="anl-card-title">${title}</span>
      <span class="anl-card-sub">${sub}</span>
    </div>
    <table class="anl-table">
      <thead><tr>
        <th class="anl-th l">STRIKE</th>
        <th class="anl-th">COSTO</th><th class="anl-th">MAX WIN</th>
        <th class="anl-th">BE</th><th class="anl-th">PROB%</th>
        <th class="anl-th">RR</th><th class="anl-th">% LLENO</th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table>
    <div class="anl-note">${note}</div>
  </div>`;
}

function mkNakedPut(rows,days){
  const trs=rows.length
    ?rows.map(r=>`<tr class="anl-tr">
      <td class="anl-td l">${r.lbl}</td>
      <td class="anl-td c-tna-bid">${r.tnaBid!=null?fn(r.tnaBid,2)+'%':'—'}</td>
      <td class="anl-td">${r.tnaLast!=null?fn(r.tnaLast,2)+'%':'—'}</td>
      <td class="anl-td c-tna-offer">${r.tnaOff!=null?fn(r.tnaOff,2)+'%':'—'}</td>
      <td class="anl-td ${r.tnaNet!=null?(r.tnaNet>=0?'c-tna-pos':'c-tna-neg'):''}">${r.tnaNet!=null?(r.tnaNet>=0?'+':'')+fn(r.tnaNet,2)+'%':'—'}</td>
      <td class="anl-td">${r.cap?'$'+fn(r.cap,0):''}</td>
      <td class="anl-td ${r.probOk!=null?pc(100-r.probOk):''}">${r.probOk!=null?fn(r.probOk,1)+'%':'—'}</td>
    </tr>`).join('')
    :`<tr><td colspan="7" class="anl-empty">Sin datos</td></tr>`;
  return`<div class="anl-card">
    <div class="anl-card-hdr">
      <span class="anl-card-title">Naked Put — Venta de Put</span>
      <span class="anl-card-sub">Short put · cobrás prima · obligación de comprar al strike si ejercen</span>
    </div>
    <table class="anl-table">
      <thead><tr>
        <th class="anl-th l">STRIKE</th>
        <th class="anl-th">TNA BID</th><th class="anl-th">TNA LAST</th>
        <th class="anl-th">TNA OFFER</th><th class="anl-th">TNA NETA CF</th>
        <th class="anl-th">CAP. RIESGO</th><th class="anl-th">PROB OK</th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table>
    <div class="anl-note">TNA Neta CF: TNA Last – TLR (19,9%). <b style="color:var(--text2)">Prob OK</b>: prob BS de no ser ejercido.</div>
  </div>`;
}

// ── Init ──────────────────────────────────────────────────────
anlLoad();
if(gTimer)clearInterval(gTimer);
gTimer=setInterval(anlLoad,30000);

})();
</script>
