<div class="sub-tabs-row">
  <div class="sub-tabs">
    <button class="stab active" id="mkstab-data" onclick="mkTab('data',this)">Market Data</button>
    <button class="stab" id="mkstab-sectores" onclick="mkTab('sectores',this)">Sectors</button>
    <button class="stab" id="mkstab-rrg" onclick="mkTab('rrg',this)">RRG</button>
    <button class="stab" id="mkstab-topology" onclick="mkTab('topology',this)">Topology</button>
  </div>
  <div class="sub-tabs-meta" id="mkMeta">—</div>
</div>
<div id="mkContainer"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<script>
window.mkTab = async function(n,b){
  n=n||'data';
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  if(b) b.classList.add('active');
  const id = 'mkpanel-'+n;
  const existing = document.getElementById(id);
  if(existing) {
    document.querySelectorAll('.mk-panel').forEach(p=>p.classList.remove('active'));
    existing.classList.add('active');
    return;
  }
  // Cargar usa.html y extraer el panel correspondiente
  const map = {data:'mercado', sectores:'sectores', rrg:'rrg', topology:'topology'};
  const usId = map[n] || n;
  const r = await fetch('modules/usa.html?v='+Date.now());
  if(!r.ok) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = await r.text();
  const srcPanel = tmp.querySelector('#uspanel-'+usId);
  if(!srcPanel) return;
  const container = document.getElementById('mkContainer');
  const panel = document.createElement('div');
  panel.id = id;
  panel.className = 'sub-panel active mk-panel';
  panel.innerHTML = srcPanel.innerHTML;
  // Ejecutar scripts del panel
  panel.querySelectorAll('script').forEach(old=>{
    const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s);
  });
  document.querySelectorAll('.mk-panel').forEach(p=>p.classList.remove('active'));
  container.appendChild(panel);
  panel.classList.add('active');
  document.getElementById('mkMeta').textContent = 'OK';
};
document.addEventListener('DOMContentLoaded', ()=>window.mkTab('data',document.querySelector('#mkstab-data')));
</script>
