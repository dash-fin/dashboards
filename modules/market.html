<div class="sub-tabs-row">
  <div class="sub-tabs">
    <button class="stab active" id="mkstab-data" onclick="mkTab('data',this)">Market Data</button>
    <button class="stab" id="mkstab-sectores" onclick="mkTab('sectores',this)">Sectors</button>
    <button class="stab" id="mkstab-rrg" onclick="mkTab('rrg',this)">RRG</button>
    <button class="stab" id="mkstab-topology" onclick="mkTab('topology',this)">Topology</button>
  </div>
  <div class="sub-tabs-meta" id="mkMeta">—</div>
</div>
<div class="sub-panel active" id="mkpanel-data"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="mkpanel-sectores"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="mkpanel-rrg"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="mkpanel-topology"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<script>
(function(){
let mkLoaded = false;
const MAP = {data:'mercado', sectores:'sectores', rrg:'rrg', topology:'topology'};
window.mkTab = async (n, b) => {
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  if(b) b.classList.add('active');
  document.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('mkpanel-'+n).classList.add('active');
  if(!mkLoaded) {
    mkLoaded = true;
    document.getElementById('mkMeta').textContent = 'Cargando...';
    const r = await fetch('modules/usa.html?v='+Date.now());
    if(!r.ok) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = await r.text();
    Object.entries(MAP).forEach(([key, usId]) => {
      const el = tmp.querySelector('#uspanel-'+usId);
      if(el) document.getElementById('mkpanel-'+key).innerHTML = el.outerHTML;
    });
    document.getElementById('mkMeta').textContent = 'OK';
  }
};
document.addEventListener('DOMContentLoaded', ()=>mkTab('data',document.querySelector('#mkstab-data')));
})();
</script>
