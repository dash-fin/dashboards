<div class="sub-tabs-row">
  <div class="sub-tabs">
    <button class="stab active" id="anstab-shortint" onclick="anTab('shortint',this)">Short Data</button>
    <button class="stab" id="anstab-af" onclick="anTab('af',this)">AF vs AT</button>
    <button class="stab" id="anstab-macro" onclick="anTab('macro',this)">Macro</button>
    <button class="stab" id="anstab-insider" onclick="anTab('insider',this)">Insider</button>
    <button class="stab" id="anstab-smartmoney" onclick="anTab('smartmoney',this)">Smart Money</button>
  </div>
  <div class="sub-tabs-meta" id="anMeta">—</div>
</div>
<div class="sub-panel active" id="anpanel-shortint"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="anpanel-af"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="anpanel-macro"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="anpanel-insider"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<div class="sub-panel" id="anpanel-smartmoney"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<script>
(function(){
let anLoaded = false;
const MAP = {shortint:'shortint', af:'af', macro:'macro', insider:'insider', smartmoney:'smartmoney'};
window.anTab = async (n, b) => {
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  if(b) b.classList.add('active');
  document.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('anpanel-'+n).classList.add('active');
  if(!anLoaded) {
    anLoaded = true;
    document.getElementById('anMeta').textContent = 'Cargando...';
    const r = await fetch('modules/usa.html?v='+Date.now());
    if(!r.ok) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = await r.text();
    Object.entries(MAP).forEach(([key, usId]) => {
      const el = tmp.querySelector('#uspanel-'+usId);
      if(el) document.getElementById('anpanel-'+key).innerHTML = el.outerHTML;
    });
    document.getElementById('anMeta').textContent = 'OK';
  }
};
document.addEventListener('DOMContentLoaded', ()=>anTab('shortint',document.querySelector('#anstab-shortint')));
})();
</script>
