<div class="sub-tabs-row">
  <div class="sub-tabs">
    <button class="stab active" id="anstab-shortint" onclick="anTab('shortint',this)">Short Data</button>
    <button class="stab" id="anstab-af" onclick="anTab('af',this)">AF vs AT</button>
    <button class="stab" id="anstab-macro" onclick="anTab('macro',this)">Macro</button>
    <button class="stab" id="anstab-insider" onclick="anTab('insider',this)">Insider</button>
    <button class="stab" id="anstab-smartmoney" onclick="anTab('smartmoney',this)">Smart Money</button>
  </div>
  <div class="sub-tabs-meta" id="anMeta">—</div>
</div>
<div id="anContainer"><div class="module-loading"><div class="spinner"></div>Cargando...</div></div>
<script>
window.anTab = async function(n,b){
  n=n||'shortint';
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  if(b) b.classList.add('active');
  const id = 'anpanel-'+n;
  const existing = document.getElementById(id);
  if(existing) {
    document.querySelectorAll('.an-panel').forEach(p=>p.classList.remove('active'));
    existing.classList.add('active');
    return;
  }
  const map = {shortint:'shortint', af:'af', macro:'macro', insider:'insider', smartmoney:'smartmoney'};
  const usId = map[n] || n;
  const r = await fetch('modules/usa.html?v='+Date.now());
  if(!r.ok) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = await r.text();
  const srcPanel = tmp.querySelector('#uspanel-'+usId);
  if(!srcPanel) return;
  const container = document.getElementById('anContainer');
  const panel = document.createElement('div');
  panel.id = id;
  panel.className = 'sub-panel active an-panel';
  panel.innerHTML = srcPanel.innerHTML;
  panel.querySelectorAll('script').forEach(old=>{
    const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s);
  });
  document.querySelectorAll('.an-panel').forEach(p=>p.classList.remove('active'));
  container.appendChild(panel);
  panel.classList.add('active');
  document.getElementById('anMeta').textContent = 'OK';
};
document.addEventListener('DOMContentLoaded', ()=>window.anTab('shortint',document.querySelector('#anstab-shortint')));
</script>
