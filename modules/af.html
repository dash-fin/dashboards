<style>
.af-wrap{padding:16px;max-width:1100px}
.af-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.af-search{display:flex;align-items:center;gap:0;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;overflow:hidden}
.af-search input{background:transparent;border:none;outline:none;padding:7px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);width:130px;text-transform:uppercase}
.af-search input::placeholder{text-transform:none;color:var(--text3)}
.af-btn{background:var(--green);border:none;color:#000;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.8px;padding:7px 14px;cursor:pointer;border-radius:4px;text-transform:uppercase;transition:opacity .15s}
.af-btn:hover{opacity:.85}
.af-btn.sec{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}
.af-btn.sec.active{border-color:var(--green);color:var(--green)}
.af-head{margin-bottom:12px}
.af-ticker-name{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--text);letter-spacing:1px}
.af-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);margin-top:3px}
.af-kpis{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.af-kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 14px;min-width:90px}
.af-kpi-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.af-kpi-val{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--text)}
.af-chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;position:relative}
.af-chart-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px 4px;position:absolute;top:0;left:0;z-index:10}
#afPriceChart{height:340px}
.af-sub-svg{width:100%;display:block}
.af-empty{text-align:center;padding:60px 20px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3)}
.af-err{color:var(--red);font-size:10px;font-family:'IBM Plex Mono',monospace;padding:4px 0}
</style>

<div class="af-wrap">
  <div class="af-toolbar">
    <div class="af-search">
      <input id="afInput" placeholder="Ticker (ej: NOW)" value="NOW" onkeydown="if(event.key==='Enter')afLoad()">
    </div>
    <button class="af-btn" onclick="afLoad()">↗ Analizar</button>
    <div style="display:flex;gap:4px" id="afRangeBar">
      <button class="af-btn sec active" data-r="5y"  onclick="afSetRange(this)">5A</button>
      <button class="af-btn sec"        data-r="3y"  onclick="afSetRange(this)">3A</button>
      <button class="af-btn sec"        data-r="1y"  onclick="afSetRange(this)">1A</button>
    </div>
    <span id="afErr" class="af-err"></span>
  </div>

  <div id="afBody">
    <div class="af-empty">Ingresá un ticker y presioná Analizar</div>
  </div>
</div>

<script>
(function(){
const fn2=(n,d=1)=>{if(n==null||isNaN(n))return'—';return(n<0?'-':'')+Math.abs(n).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
const fmtB=n=>{if(!n)return'—';const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1)+'B';if(a>=1e6)return(n/1e6).toFixed(0)+'M';return n.toLocaleString();};
const pct=(a,b)=>b?((a-b)/Math.abs(b)*100):null;

let gRange='5y', gTicker='', gChart=null;

const AF_EF='https://endymbpdayeidromxayb.supabase.co/functions/v1/yahoo-prices';
const afEfFetch=async body=>{
  const r=await fetch(AF_EF,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  return d;
};

window.afSetRange=el=>{
  document.querySelectorAll('#afRangeBar .af-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  gRange=el.dataset.r;
  if(gTicker)afLoad();
};

window.afLoad=async()=>{
  const ticker=document.getElementById('afInput').value.trim().toUpperCase();
  if(!ticker)return;
  gTicker=ticker;
  document.getElementById('afErr').textContent='';
  document.getElementById('afBody').innerHTML='<div class="af-empty">Cargando '+ticker+'…</div>';

  try{
    const {chart:chartData, summary:summaryData, finnhub:fhData}=await afEfFetch({mode:'af-data',ticker,range:gRange});

    // ── Parse price data ──
    const res=chartData?.chart?.result?.[0];
    if(!res)throw new Error('Sin datos de precio para '+ticker);
    const ts=res.timestamp;
    const q=res.indicators?.quote?.[0];
    const ohlcv=ts.map((t,i)=>({
      t:t, time:Math.floor(t), // unix timestamp
      o:q.open[i], h:q.high[i], l:q.low[i], c:q.close[i], v:q.volume[i]
    })).filter(d=>d.o&&d.h&&d.l&&d.c);

    const companyName=res.meta?.longName||res.meta?.shortName||ticker;
    const currency=res.meta?.currency||'USD';
    const lastPrice=res.meta?.regularMarketPrice||ohlcv[ohlcv.length-1]?.c;

    // ── Parse fundamentals ──
    const qResult=summaryData?.quoteSummary?.result?.[0];
    const incQ=qResult?.incomeStatementHistoryQuarterly?.incomeStatementHistory||[];
    const incAnn=qResult?.incomeStatementHistory?.incomeStatementHistory||[];
    const stats=qResult?.defaultKeyStatistics||{};
    const priceInfo=qResult?.price||{};

    // Revenue trimestral (últimos 4 trimestres)
    const revQ=[...incQ].reverse().map(q=>({
      date:q.endDate?.raw*1000,
      rev:q.totalRevenue?.raw,
      eps:q.basicEPS?.raw,
      ni:q.netIncome?.raw
    })).filter(q=>q.date&&q.rev);
    revQ.forEach((q,i)=>{if(i>=4)q.yoy=pct(q.rev,revQ[i-4].rev);});

    // Revenue ANUAL (4-5 años) — para step area en gráfico de precio
    const revAnn=[...incAnn].reverse().map(q=>({
      date:q.endDate?.raw*1000,
      rev:q.totalRevenue?.raw,
      eps:q.basicEPS?.raw,
      ni:q.netIncome?.raw
    })).filter(q=>q.date&&q.rev);
    revAnn.forEach((q,i)=>{if(i>=1)q.yoy=pct(q.rev,revAnn[i-1].rev);});

    // Revenue TRIMESTRAL combinado: sintético desde anuales + actuals recientes
    const qFirstMs=revQ.length?revQ[0].date:Infinity;
    const synthQ=[];
    revAnn.filter(yr=>yr.date<qFirstMs).forEach(yr=>{
      for(let k=3;k>=0;k--){const d=new Date(yr.date);d.setMonth(d.getMonth()-k*3);synthQ.push({date:d.getTime(),rev:yr.rev/4,eps:yr.eps!=null?yr.eps/4:null,ni:yr.ni!=null?yr.ni/4:null,synth:true});}
    });
    const revQCombined=[...synthQ,...revQ].sort((a,b)=>a.date-b.date);
    revQCombined.forEach((q,i)=>{if(i>=4)q.yoy=pct(q.rev,revQCombined[i-4].rev);});

    // ── Drawdown from ATH ──
    let ath=0;
    const dd=ohlcv.map(d=>{
      if(d.c>ath)ath=d.c;
      return{time:d.time, val:ath>0?(d.c-ath)/ath*100:0};
    });

    // ── P/E estimate per week (Finnhub-first, Yahoo fallback) ──
    const sharesOut=stats.sharesOutstanding?.raw||stats.impliedSharesOutstanding?.raw;
    let epsHistory=[];
    if(fhData?.earnings?.data?.length){
      epsHistory=fhData.earnings.data
        .filter(e=>e.actual!=null&&e.actual>0)
        .map(e=>({date:new Date(e.period).getTime(),eps:e.actual}))
        .sort((a,b)=>a.date-b.date);
    }
    if(epsHistory.length<4){
      epsHistory=revQCombined.map(q=>{
        let eps=q.eps;
        if(eps==null&&q.ni!=null&&sharesOut)eps=q.ni/sharesOut;
        return{date:q.date,eps};
      }).filter(q=>q.eps!=null&&q.eps>0);
    }
    const peData=ohlcv.map(d=>{
      const ms=d.t*1000;
      const trailing=epsHistory.filter(e=>e.date<=ms).slice(-4);
      if(trailing.length<4)return null;
      const sumEps=trailing.reduce((s,e)=>s+e.eps,0);
      if(sumEps<=0)return null;
      return{time:d.time, val:d.c/sumEps};
    }).filter(Boolean);

    // ── Current KPIs ──
    const pe=stats.trailingPE?.raw;
    const mktCap=priceInfo.marketCap?.raw;
    const fwdPE=stats.forwardPE?.raw;
    const lastRevAnn=revAnn[revAnn.length-1];
    const lastYoy=lastRevAnn?.yoy;

    // ── Finnhub fundamentals & price target ──
    const fhMet=fhData?.metrics?.metric||{};
    const ptMean=fhData?.priceTarget?.targetMean;
    const ptHigh=fhData?.priceTarget?.targetHigh;
    const ptLow=fhData?.priceTarget?.targetLow;
    const ptUpside=ptMean&&lastPrice?((ptMean-lastPrice)/lastPrice*100):null;
    const fhRec=fhData?.recommendations;

    afRender(ticker,companyName,currency,lastPrice,ohlcv,revQ,revAnn,dd,peData,
      {pe,mktCap,fwdPE,lastYoy,ptMean,ptHigh,ptLow,ptUpside,
       grossMargin:fhMet.grossMarginTTM, netMargin:fhMet.netProfitMarginTTM,
       roe:fhMet.roeTTM, revGrowth:fhMet.revenueGrowthTTMYoy,
       epsGrowth:fhMet.epsGrowthTTMYoy, de:fhMet['totalDebt/totalEquityAnnual']},
      revQCombined, fhRec);
  }catch(e){
    console.error('[af]',e);
    document.getElementById('afErr').textContent='Error: '+e.message;
    document.getElementById('afBody').innerHTML='<div class="af-empty" style="color:var(--red)">No se pudo cargar '+ticker+'.<br><span style="font-size:9px;color:var(--text3)">Verificá el ticker o intentá de nuevo.</span></div>';
  }
};

function afRender(ticker,name,curr,price,ohlcv,revQ,revAnn,dd,peData,kpis,revQCombined,fhRec){
  const fv=(n,d=2)=>n!=null&&!isNaN(n)?fn2(n,d):'—';

  const yoyColor=kpis.lastYoy!=null?(kpis.lastYoy>0?'var(--green)':'var(--red)'):'var(--text3)';

  document.getElementById('afBody').innerHTML=`
    <div class="af-head">
      <div class="af-ticker-name">${ticker} <span style="color:var(--text3);font-weight:400;font-size:12px">${name}</span></div>
      <div class="af-meta">${curr} · Datos semanales</div>
    </div>
    <div class="af-kpis">
      <div class="af-kpi"><div class="af-kpi-lbl">Precio</div><div class="af-kpi-val">${fv(price)}</div></div>
      <div class="af-kpi"><div class="af-kpi-lbl">P/E Trailing</div><div class="af-kpi-val">${kpis.pe!=null?fv(kpis.pe,0)+'x':'—'}</div></div>
      <div class="af-kpi"><div class="af-kpi-lbl">P/E Forward</div><div class="af-kpi-val">${kpis.fwdPE!=null?fv(kpis.fwdPE,0)+'x':'—'}</div></div>
      <div class="af-kpi"><div class="af-kpi-lbl">Mkt Cap</div><div class="af-kpi-val">${fmtB(kpis.mktCap)}</div></div>
      <div class="af-kpi"><div class="af-kpi-lbl">Rev YoY</div><div class="af-kpi-val" style="color:${yoyColor}">${kpis.lastYoy!=null?(kpis.lastYoy>=0?'+':'')+fv(kpis.lastYoy,1)+'%':'—'}</div></div>
      <div class="af-kpi"><div class="af-kpi-lbl">Target</div><div class="af-kpi-val">${kpis.ptMean!=null?fv(kpis.ptMean):'—'}</div></div>
      <div class="af-kpi"><div class="af-kpi-lbl">Upside</div><div class="af-kpi-val" style="color:${kpis.ptUpside>0?'var(--green)':kpis.ptUpside<0?'var(--red)':'var(--text3)'}">${kpis.ptUpside!=null?(kpis.ptUpside>=0?'+':'')+fv(kpis.ptUpside,1)+'%':'—'}</div></div>
    </div>
    <div class="af-chart-card" style="margin-bottom:8px">
      <div class="af-chart-lbl">Precio semanal · Volumen · Revenue growth (área verde)</div>
      <div id="afPriceChart"></div>
    </div>
    <div class="af-chart-card" style="margin-bottom:8px">
      <div class="af-chart-lbl">Revenue trimestral · crecimiento YoY</div>
      <svg id="afRevSvg" class="af-sub-svg" height="130"></svg>
    </div>
    <div class="af-chart-card" style="margin-bottom:8px">
      <div class="af-chart-lbl">P/E TRAILING — Evolución semanal (precio / EPS trailing 4Q)</div>
      <svg id="afPeSvg" class="af-sub-svg" height="100"></svg>
    </div>
    <div class="af-chart-card" style="margin-bottom:8px">
      <div class="af-chart-lbl">Drawdown desde ATH</div>
      <svg id="afDdSvg" class="af-sub-svg" height="90"></svg>
    </div>
    <div class="af-chart-card" style="margin-bottom:8px">
      <div class="af-chart-lbl">Fundamentals (TTM)</div>
      <div id="afFundamentals" style="padding:12px 16px 16px;display:flex;gap:16px;flex-wrap:wrap"></div>
    </div>
    <div class="af-chart-card">
      <div class="af-chart-lbl">Consenso analistas · últimos 12 meses</div>
      <svg id="afConSvg" class="af-sub-svg" height="90"></svg>
    </div>
  `;

  // ── LightweightCharts — precio ──
  if(gChart){try{gChart.remove();}catch(e){} gChart=null;}
  const container=document.getElementById('afPriceChart');
  gChart=LightweightCharts.createChart(container,{
    width:container.clientWidth, height:340,
    layout:{background:{type:'solid',color:'transparent'},textColor:'rgba(200,218,240,.6)'},
    grid:{vertLines:{color:'rgba(255,255,255,.04)'},horzLines:{color:'rgba(255,255,255,.04)'}},
    timeScale:{timeVisible:false,borderColor:'rgba(255,255,255,.1)'},
    rightPriceScale:{borderColor:'rgba(255,255,255,.1)'},
    crosshair:{mode:1},
    handleScroll:true, handleScale:true,
  });

  // Revenue step area — cada escalón = un trimestre real; historia previa como revAnn/4
  const qFirstDate=revQ.length?revQ[0].date:Infinity;
  const revAnnAsQ=revAnn.filter(q=>q.date<qFirstDate).map(q=>({...q,rev:q.rev/4}));
  const revCombined=[...revAnnAsQ,...revQ].sort((a,b)=>a.date-b.date);
  const revForArea=(revCombined.length>=2?revCombined:(revQ.length>=2?revQ:revAnn.map(q=>({...q,rev:q.rev/4})))).slice().sort((a,b)=>a.date-b.date);
  if(revForArea.length>=2){
    const pMax=Math.max(...ohlcv.map(d=>d.h));
    const revVals=revForArea.map(q=>q.rev);
    const rMin=Math.min(...revVals),rMax=Math.max(...revVals);
    const scaleRev=r=>pMax*(0.04+(r-rMin)/(rMax-rMin||1)*0.68);
    // Asignar a cada vela semanal el revenue del año fiscal más reciente anterior
    const weeklyStep=[];
    ohlcv.forEach(bar=>{
      const ms=bar.t*1000;
      let rev=null;
      for(let j=0;j<revForArea.length;j++){if(ms>=revForArea[j].date)rev=revForArea[j].rev;}
      if(rev!==null)weeklyStep.push({time:bar.time,value:scaleRev(rev)});
    });
    if(weeklyStep.length){
      const revAreaSeries=gChart.addAreaSeries({
        lineColor:'rgba(16,200,120,.9)',
        topColor:'rgba(16,200,120,.42)',
        bottomColor:'rgba(16,200,120,.07)',
        lineWidth:2,
        lineType:0,
        priceLineVisible:false,
        lastValueVisible:false,
        crosshairMarkerVisible:false,
      });
      revAreaSeries.setData(weeklyStep);
    }
  }

  // Volumen (escala separada, 15% inferior del panel)
  const volSeries=gChart.addHistogramSeries({
    color:'rgba(100,130,160,.35)',
    priceFormat:{type:'volume'},
    priceScaleId:'vol',
  });
  gChart.priceScale('vol').applyOptions({scaleMargins:{top:.86,bottom:0},borderVisible:false});
  volSeries.setData(ohlcv.map(d=>({
    time:d.time, value:d.v||0,
    color:d.c>=d.o?'rgba(16,200,120,.28)':'rgba(255,64,96,.28)'
  })));

  // Velas (layer superior)
  const series=gChart.addCandlestickSeries({
    upColor:'#10e898',downColor:'#ff4060',
    borderUpColor:'#10e898',borderDownColor:'#ff4060',
    wickUpColor:'rgba(16,232,152,.5)',wickDownColor:'rgba(255,64,96,.5)',
  });
  series.setData(ohlcv.map(d=>({time:d.time,open:d.o,high:d.h,low:d.l,close:d.c})));

  // Markers anuales con YoY en gráfico de precio
  const annMarkSrc=revAnn.length>=2?revAnn:revQ;
  const annLbl=ms=>{const d=new Date(ms);return revAnn.length>=2?`FY'${String(d.getFullYear()).slice(2)}`:`Q${Math.ceil((d.getMonth()+1)/3)}'${String(d.getFullYear()).slice(2)}`;};
  const markers=annMarkSrc.filter(q=>q.yoy!=null).map(q=>{
    const nearestBar=ohlcv.reduce((b,d)=>Math.abs(d.t*1000-q.date)<Math.abs(b.t*1000-q.date)?d:b,ohlcv[0]);
    const sign=q.yoy>=0?'+':'';
    return{
      time:nearestBar.time,
      position:'aboveBar',
      color:q.yoy>=20?'#10e898':q.yoy>=0?'rgba(16,232,152,.7)':'#ff4060',
      shape:'circle',
      text:`${annLbl(q.date)} ${sign}${q.yoy.toFixed(1)}%`,
      size:0.6
    };
  });
  series.setMarkers(markers.sort((a,b)=>a.time-b.time));

  gChart.timeScale().fitContent();

  // ── Sub panels SVG ──
  afDrawRevBars('afRevSvg', revQCombined?.length>=4?revQCombined:(revAnn.length>=2?revAnn:revQ));
  afDrawPeChart('afPeSvg', peData);
  afDrawBars('afDdSvg', dd, v=>v.toFixed(0)+'%', 'rgba(255,64,96,.7)');

  // ── Fundamentals card ──
  const fmtPct=v=>v!=null&&!isNaN(v)?((v>=0?'+':'')+fn2(v,1)+'%'):'—';
  const fmtR=v=>v!=null&&!isNaN(v)?fn2(v,2):'—';
  const fundItems=[
    {lbl:'Gross Margin',val:fmtPct(kpis.grossMargin)},
    {lbl:'Net Margin',  val:fmtPct(kpis.netMargin)},
    {lbl:'ROE',         val:fmtPct(kpis.roe)},
    {lbl:'Rev Growth',  val:fmtPct(kpis.revGrowth)},
    {lbl:'EPS Growth',  val:fmtPct(kpis.epsGrowth)},
    {lbl:'D/E Ratio',   val:fmtR(kpis.de)},
  ];
  const fundEl=document.getElementById('afFundamentals');
  if(fundEl)fundEl.innerHTML=fundItems.map(f=>`<div class="af-kpi"><div class="af-kpi-lbl">${f.lbl}</div><div class="af-kpi-val" style="font-size:13px">${f.val}</div></div>`).join('');

  if(fhRec?.length)afDrawConsensus('afConSvg',fhRec);
}

function afDrawRevBars(id, data){
  const el=document.getElementById(id);if(!el||!data.length)return;
  const W=el.clientWidth||900,H=130,PL=44,PR=10,PT=24,PB=38;
  const cW=W-PL-PR,cH=H-PT-PB;
  const vals=data.map(q=>q.rev);
  const vMax=Math.max(...vals);
  const yS=v=>PT+cH-(v/vMax)*cH;
  const n=data.length;
  const bw=Math.max(3,cW/n*0.72);
  const xS=i=>PL+(i+0.5)*(cW/n);
  const isAnn=n<=6;
  const lbl=ms=>{const d=new Date(ms);return isAnn?`FY'${String(d.getFullYear()).slice(2)}`:`Q${Math.ceil((d.getMonth()+1)/3)}'${String(d.getFullYear()).slice(2)}`;};

  let g='';
  [0.5,1].forEach(p=>{
    const v=vMax*p;const y=yS(v).toFixed(1);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,.05)" stroke-width="1"/>`;
    g+=`<text x="${PL-4}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-size:7px;fill:rgba(200,218,240,.4);font-family:'IBM Plex Mono',monospace">${fmtB(v)}</text>`;
  });

  let bars='';
  data.forEach((q,i)=>{
    const x=(xS(i)-bw/2).toFixed(1);
    const y=yS(q.rev).toFixed(1);
    const bh=Math.max(1,(yS(0)-yS(q.rev))).toFixed(1);
    const noYoy=q.yoy==null;
    const clr=noYoy?'rgba(100,130,160,.55)':q.yoy>=20?'rgba(16,200,120,.8)':q.yoy>=0?'rgba(16,200,120,.5)':'rgba(255,64,96,.75)';
    bars+=`<rect x="${x}" y="${y}" width="${bw.toFixed(1)}" height="${bh}" fill="${clr}" rx="2"/>`;
    bars+=`<text x="${xS(i).toFixed(1)}" y="${H-10}" text-anchor="middle" style="font-size:7px;fill:rgba(200,218,240,.5);font-family:'IBM Plex Mono',monospace">${lbl(q.date)}</text>`;
    if(!noYoy){
      const sign=q.yoy>=0?'+':'';
      const tc=q.yoy>=20?'#10e898':q.yoy>=0?'rgba(16,232,152,.85)':'#ff4060';
      bars+=`<text x="${xS(i).toFixed(1)}" y="${(parseFloat(y)-5).toFixed(1)}" text-anchor="middle" style="font-size:7.5px;fill:${tc};font-weight:700;font-family:'IBM Plex Mono',monospace">${sign}${q.yoy.toFixed(0)}%</text>`;
    }
  });

  el.innerHTML=`${g}${bars}`;
}

function afDrawPeChart(id, data){
  const el=document.getElementById(id);if(!el||!data.length)return;
  const W=el.clientWidth||900,H=100,PL=38,PR=42,PT=18,PB=20;
  const cW=W-PL-PR,cH=H-PT-PB;
  const vals=data.map(d=>d.val);
  const vMin=Math.max(0,Math.min(...vals)*0.88),vMax=Math.max(...vals)*1.08;
  const xS=i=>PL+(i/(data.length-1))*cW;
  const yS=v=>PT+cH-((v-vMin)/(vMax-vMin||1))*cH;

  // Reference lines at 20x and 35x
  let g='';
  [20,35].forEach(ref=>{
    if(ref<=vMin||ref>=vMax)return;
    const y=yS(ref).toFixed(1);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,.07)" stroke-width="1" stroke-dasharray="3,4"/>`;
    g+=`<text x="${PL-4}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-size:7px;fill:rgba(200,218,240,.3);font-family:'IBM Plex Mono',monospace">${ref}x</text>`;
  });

  // Colored line segments
  let segs='';
  for(let i=0;i<data.length-1;i++){
    const x1=xS(i).toFixed(1),y1=yS(data[i].val).toFixed(1);
    const x2=xS(i+1).toFixed(1),y2=yS(data[i+1].val).toFixed(1);
    const avg=(data[i].val+data[i+1].val)/2;
    const c=avg<20?'rgba(16,200,120,.85)':avg<35?'rgba(68,136,255,.85)':'rgba(255,64,96,.85)';
    segs+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.5"/>`;
  }

  // Labels at local peaks & troughs (like TrendSpider)
  const win=Math.max(8,Math.floor(data.length/18));
  const extremes=[];
  for(let i=win;i<data.length-win;i++){
    let isPk=true,isTr=true;
    for(let k=1;k<=win;k++){
      if(data[i-k].val>=data[i].val||data[i+k].val>=data[i].val)isPk=false;
      if(data[i-k].val<=data[i].val||data[i+k].val<=data[i].val)isTr=false;
    }
    if(isPk||isTr)extremes.push({i,pk:isPk});
  }
  // Keep at most 8, spread evenly if too many
  const minGap=Math.floor(data.length/9);
  const kept=[];
  for(const e of extremes){if(!kept.length||e.i-kept[kept.length-1].i>=minGap)kept.push(e);}
  let lbls='';
  kept.forEach(({i,pk})=>{
    const d=data[i],v=Math.round(d.val);
    const cx=xS(i).toFixed(1),cy=yS(d.val).toFixed(1);
    const c=v<20?'#10e898':v<35?'rgba(68,136,255,.9)':'#ff4060';
    const ty=(pk?Math.max(PT+9,parseFloat(cy)-9):Math.min(H-PB-2,parseFloat(cy)+13)).toFixed(1);
    lbls+=`<circle cx="${cx}" cy="${cy}" r="2.5" fill="${c}" opacity=".85"/>`;
    lbls+=`<text x="${cx}" y="${ty}" text-anchor="middle" style="font-size:7px;fill:${c};font-weight:700;font-family:'IBM Plex Mono',monospace">${v}x</text>`;
  });

  // Last value badge
  const last=data[data.length-1],lv=Math.round(last.val);
  const lc=lv<20?'#10e898':lv<35?'rgba(68,136,255,.9)':'#ff4060';
  const lx=(W-PR+3).toFixed(1),ly=yS(last.val).toFixed(1);
  const badge=`<rect x="${lx}" y="${(parseFloat(ly)-8).toFixed(1)}" width="36" height="15" rx="2" fill="${lc}" opacity=".9"/>
  <text x="${(parseFloat(lx)+18).toFixed(1)}" y="${(parseFloat(ly)+.5).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" style="font-size:7.5px;fill:#000;font-weight:700;font-family:'IBM Plex Mono',monospace">${lv}x</text>`;

  el.innerHTML=`${g}${segs}${lbls}${badge}`;
}

function afDrawLine(id, data, fmtY, color, colorFn){
  const el=document.getElementById(id);if(!el||!data.length)return;
  const W=el.clientWidth||900,H=90,PL=38,PR=10,PT=16,PB=20;
  const cW=W-PL-PR,cH=H-PT-PB;
  const vals=data.map(d=>d.val);
  const vMin=Math.min(...vals),vMax=Math.max(...vals);
  const xS=i=>PL+(i/(data.length-1))*cW;
  const yS=v=>PT+cH-((v-vMin)/(vMax-vMin||1))*cH;

  // Grid lines
  let g='';
  [0,.5,1].forEach(p=>{
    const v=vMin+(vMax-vMin)*p;
    const y=yS(v).toFixed(1);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,.05)" stroke-width="1"/>`;
    g+=`<text x="${PL-4}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-size:7px;fill:rgba(200,218,240,.4);font-family:'IBM Plex Mono',monospace">${fmtY(v.toFixed(0))}</text>`;
  });

  // Line path
  const path=data.map((d,i)=>(i?'L':'M')+xS(i).toFixed(1)+','+yS(d.val).toFixed(1)).join(' ');

  // Last value label
  const last=data[data.length-1];
  const lastColor=colorFn?colorFn(last.val):color;
  const lastX=(W-PR+2).toFixed(1),lastY=yS(last.val).toFixed(1);
  const lastLabel=`<rect x="${lastX}" y="${parseFloat(lastY)-8}" width="32" height="14" rx="2" fill="${lastColor}" opacity=".9"/>
  <text x="${parseFloat(lastX)+16}" y="${parseFloat(lastY)+1}" text-anchor="middle" dominant-baseline="middle" style="font-size:7px;fill:#000;font-weight:700;font-family:'IBM Plex Mono',monospace">${fmtY(last.val.toFixed(0))}</text>`;

  el.innerHTML=`${g}<path d="${path}" stroke="${color}" stroke-width="1.5" fill="none" stroke-linejoin="round"/>${lastLabel}`;
}

function afDrawBars(id, data, fmtY, color){
  const el=document.getElementById(id);if(!el||!data.length)return;
  const W=el.clientWidth||900,H=90,PL=38,PR=10,PT=16,PB=20;
  const cW=W-PL-PR,cH=H-PT-PB;
  const vals=data.map(d=>d.val);
  const vMin=Math.min(...vals,0),vMax=Math.max(...vals,0);
  const xS=i=>PL+(i/(data.length-1))*cW;
  const yS=v=>PT+cH-((v-vMin)/(vMax-vMin||1))*cH;
  const y0=yS(0).toFixed(1);
  const bw=Math.max(1,(cW/data.length)-1);

  let g='';
  [0,.5,1].forEach(p=>{
    const v=vMin+(vMax-vMin)*p;
    const y=yS(v).toFixed(1);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,.05)" stroke-width="1"/>`;
    g+=`<text x="${PL-4}" y="${y}" text-anchor="end" dominant-baseline="middle" style="font-size:7px;fill:rgba(200,218,240,.4);font-family:'IBM Plex Mono',monospace">${fmtY(v)}</text>`;
  });

  let bars='';
  data.forEach((d,i)=>{
    const x=(xS(i)-bw/2).toFixed(1);
    const y=yS(Math.max(d.val,0)).toFixed(1);
    const barH=Math.abs(yS(d.val)-yS(0));
    if(barH>0) bars+=`<rect x="${x}" y="${d.val<0?y0:y}" width="${bw.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}">
      <title>${fmtY(d.val)}</title></rect>`;
  });

  // Worst drawdown label
  const worst=Math.min(...vals);
  el.innerHTML=`${g}<line x1="${PL}" y1="${y0}" x2="${W-PR}" y2="${y0}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>${bars}
  <text x="${W-PR-2}" y="${H-PB+14}" text-anchor="end" style="font-size:8px;fill:var(--red);font-family:'IBM Plex Mono',monospace">Máx: ${fmtY(worst)}</text>`;
}

function afDrawConsensus(id, data){
  const el=document.getElementById(id);if(!el||!data.length)return;
  const W=el.clientWidth||900,H=90,PL=8,PR=8,PT=16,PB=28;
  const cW=W-PL-PR,cH=H-PT-PB;
  const recent=data.slice().sort((a,b)=>new Date(a.period)-new Date(b.period)).slice(-12);
  const n=recent.length;if(!n)return;
  const gap=cW/n;
  const bw=Math.max(4,gap*0.82);
  const xS=i=>PL+i*gap+gap/2;
  const totals=recent.map(r=>(r.strongBuy||0)+(r.buy||0)+(r.hold||0)+(r.sell||0)+(r.strongSell||0));
  const maxT=Math.max(...totals,1);
  let bars='';
  recent.forEach((r,i)=>{
    const x=(xS(i)-bw/2).toFixed(1);
    const buys=(r.strongBuy||0)+(r.buy||0);
    const holds=r.hold||0;
    const sells=(r.sell||0)+(r.strongSell||0);
    let yy=PT+cH;
    const seg=(v,clr)=>{
      if(!v)return'';
      const h=((v/maxT)*cH).toFixed(1);
      yy-=parseFloat(h);
      return`<rect x="${x}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h}" fill="${clr}" rx="1"/>`;
    };
    bars+=seg(sells,'rgba(255,64,96,.75)');
    bars+=seg(holds,'rgba(200,218,240,.3)');
    bars+=seg(buys,'rgba(16,200,120,.75)');
    const d=new Date(r.period);
    bars+=`<text x="${xS(i).toFixed(1)}" y="${H-8}" text-anchor="middle" style="font-size:6.5px;fill:rgba(200,218,240,.4);font-family:'IBM Plex Mono',monospace">${d.getMonth()+1}/${String(d.getFullYear()).slice(2)}</text>`;
    if(i===n-1){
      const total=buys+holds+sells;
      if(total>0){
        const pctBuy=Math.round(buys/total*100);
        const yTop=PT+cH-((totals[i]/maxT)*cH)-6;
        bars+=`<text x="${xS(i).toFixed(1)}" y="${yTop.toFixed(1)}" text-anchor="middle" style="font-size:7px;fill:rgba(16,200,120,.85);font-weight:700;font-family:'IBM Plex Mono',monospace">${pctBuy}%↑</text>`;
      }
    }
  });
  el.innerHTML=bars;
}

// Responsive resize
window.addEventListener('resize',()=>{
  if(gChart){const c=document.getElementById('afPriceChart');if(c)gChart.resize(c.clientWidth,320);}
  if(gTicker){
    afDrawLine('afPeSvg',[],()=>'','',''); // redraw on resize would need stored data
  }
});

})();
</script>
