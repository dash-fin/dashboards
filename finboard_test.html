<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FINBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080b0e;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;margin:0;overflow:hidden}

.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:linear-gradient(180deg,#263742 0%,#1C2931 45%,#11181C 100%);box-shadow:0 0 0 1px rgba(120,138,148,0.15),0 0 50px rgba(0,217,255,0.04),0 30px 80px rgba(0,0,0,0.85)}
.phone::before{content:'';position:absolute;inset:0;border-radius:44px;pointer-events:none;z-index:999;box-shadow:inset 0 1px 0 rgba(170,190,210,0.04),inset 0 -2px 0 rgba(0,0,0,0.60),inset 1px 0 0 rgba(40,60,80,0.03),inset -1px 0 0 rgba(40,60,80,0.03)}
.vignette{position:absolute;inset:0;z-index:998;pointer-events:none;border-radius:44px;background:radial-gradient(ellipse at center,transparent 65%,rgba(0,0,0,0.40)100%)}
#chartCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:0.22}
.grid{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(14,165,233,0.004)1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,0.004)1px,transparent 1px);background-size:35px 35px;opacity:0.5}
.noise{position:absolute;inset:0;z-index:992;pointer-events:none;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#particlesCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.content{position:relative;z-index:10;height:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;padding:0 22px 28px}
.content::-webkit-scrollbar{display:none}

.brand{text-align:center;padding-top:40px;margin-bottom:10px}
.brand img{width:auto;max-width:82%;max-height:56px;display:block;margin:0 auto;object-fit:contain;animation:titleGlow 3.5s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(0,217,255,0.20)) drop-shadow(0 0 40px rgba(0,217,255,0.06)) brightness(1.06) contrast(1.1)}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(0,217,255,0.10)) drop-shadow(0 0 25px rgba(0,217,255,0.03)) brightness(1.06) contrast(1.1)}50%{filter:drop-shadow(0 0 22px rgba(0,217,255,0.35)) drop-shadow(0 0 60px rgba(0,217,255,0.10)) brightness(1.10) contrast(1.12)}}

.logo-wrap{position:relative;display:flex;justify-content:center;align-items:center;min-height:270px;width:100%;margin-top:24px}
#logoMain{width:auto;max-width:285px;max-height:270px;display:block;object-fit:contain;animation:floating 6s ease-in-out infinite;filter:drop-shadow(0 0 35px rgba(0,217,255,0.28)) drop-shadow(0 0 70px rgba(0,217,255,0.08))}
@keyframes floating{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-2px) scale(1.002)}50%{transform:translateY(0) scale(1)}75%{transform:translateY(-1px) scale(1.001)}}

.ptag{position:absolute;padding:2px 0;background:transparent;border:none;left:5%;top:14%;font-family:'JetBrains Mono',monospace;font-size:9px;color:#00e5a8;white-space:nowrap;animation:vPulse 3s ease-in-out infinite}
.ftag{position:absolute;padding:2px 0;background:transparent;border:none;font-family:'JetBrains Mono',monospace;font-size:9px;color:#BCCCD6;white-space:nowrap}
.ftag .v{font-weight:700;color:#00e5a8;margin-left:2px;display:inline;animation:vPulse 2.5s ease-in-out infinite}
.ftag .v.dn{color:#ff4560}
.ftag.f1{right:4%;top:43%}
.ftag.f2{right:4%;top:50%}
.ftag.f3{right:4%;top:36%}
.ftag.f4{left:4%;top:64%}
.ftag.f5{right:4%;top:57%}
@keyframes vPulse{0%,100%{opacity:1}50%{opacity:0.4}}

.form{width:100%;margin-top:70px;padding:0 2px}
.field{margin-bottom:12px}
.flbl{display:block;font-size:11px;font-weight:800;letter-spacing:2px;color:#D1E2EB;text-transform:uppercase;margin-bottom:4px;padding-left:2px;opacity:0.7}
.input-neo{width:100%;height:42px;border-radius:4px;background:rgba(18,26,31,0.65);position:relative;overflow:hidden;border:1px solid rgba(0,229,255,0.35)}
input{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;outline:none;padding:0 14px;font-size:13px;color:#c8daf0;font-family:'JetBrains Mono',monospace}
input::placeholder{color:#2a3a4a}
.btn-wrap{position:relative;width:100%;height:44px;margin-top:16px}
.btn-glow{position:absolute;top:2px;left:6%;right:6%;bottom:-12px;border-radius:4px;filter:blur(20px);background:#00A8C5;animation:btnPulse 3s ease-in-out infinite}
@keyframes btnPulse{0%,100%{opacity:0.08;transform:scaleX(0.85)}50%{opacity:0.25;transform:scaleX(1.0)}}
.btn-primary{position:absolute;inset:0;width:100%;height:100%;border:none;cursor:pointer;overflow:hidden;background:linear-gradient(135deg,#007385 0%,#72E9FF 50%,#007385 100%);display:flex;align-items:center;justify-content:center;clip-path:polygon(10px 0,100%0,100% calc(100%-10px),calc(100%-10px)100%,0 100%,0 10px)}
.btn-primary span{font-size:11px;font-weight:700;letter-spacing:3px;color:#fff;text-transform:uppercase;text-shadow:0 0 10px rgba(0,0,0,0.6)}
.footer-txt{margin-top:24px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:#6B7D87;letter-spacing:0.5px}
</style>
</head>
