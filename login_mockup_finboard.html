<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FINBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--c1:#1A242D;--c2:#0B0E11;--cyan:#00E5FF;--cyan-dim:rgba(0,229,255,0.12);--accent:#0ea5e9;--purple:#818cf8;--green:#00e5a8;--t1:#c8d8f0;--t2:#5a7a9a;--t3:#2a3a4a;--gold:#d4a84b}
body{background:#070b12;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif}

/* ── Phone shell ── */
.phone{
  width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 50% 30%, var(--c1) 0%, var(--c2) 70%);
  box-shadow:0 0 0 1px rgba(60,90,120,0.4),0 0 60px rgba(14,165,233,0.10),0 30px 80px rgba(0,0,0,0.8);
}
.phone::before{
  content:'';position:absolute;inset:0;border-radius:44px;
  box-shadow:inset 0 1px 0 rgba(120,160,200,0.15),inset 0 -1px 0 rgba(0,0,0,0.4),inset 1px 0 0 rgba(60,90,120,0.08),inset -1px 0 0 rgba(60,90,120,0.08);
  pointer-events:none;z-index:999;
}

/* ── Vignette ── */
.vignette{
  position:absolute;inset:0;z-index:998;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
}

/* ── Scanlines ── */
.scanlines{
  position:absolute;inset:0;z-index:990;pointer-events:none;overflow:hidden;opacity:0.035;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.12) 2px, rgba(0,229,255,0.12) 3px);
}

/* ── Chart canvas ── */
#chartCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* Subtle grid */
.grid{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:linear-gradient(rgba(14,165,233,0.02) 1px, transparent 1px),linear-gradient(90deg, rgba(14,165,233,0.02) 1px, transparent 1px);
  background-size:40px 40px;
}

/* ── Content ── */
.content{
  position:relative;z-index:10;height:100%;overflow-y:auto;scrollbar-width:none;
  display:flex;flex-direction:column;padding:0 24px 28px;
}
.content::-webkit-scrollbar{display:none}

/* ── Portfolio Tag (top left style) ── */
.portfolio-tag{
  align-self:flex-start;padding:4px 10px;margin-top:22px;
  background:rgba(6,10,16,0.85);border:1px solid rgba(0,229,168,0.15);
  border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--green);letter-spacing:0.5px;
}
.portfolio-tag .bracket{color:var(--t3);}

/* ── Brand ── */
.brand{text-align:center;padding-top:18px;}
.brand-title{
  font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;letter-spacing:8px;
  color:#fff;
  text-shadow:
    0 1px 0 rgba(200,220,255,0.3),
    0 -1px 2px rgba(0,0,0,0.8),
    0 0 20px rgba(0,229,255,0.3),
    0 0 50px rgba(0,229,255,0.08);
}
.brand-title .hi{color:var(--gold);}
.brand-sub{
  font-size:7px;letter-spacing:4px;color:var(--t3);
  font-weight:700;text-transform:uppercase;margin-top:4px;
}

/* ── Logo / Hero ── */
.logo-wrap{
  position:relative;display:flex;justify-content:center;align-items:center;
  margin-top:2px;height:195px;width:100%;
}


/* Floating data tags around logo */
.ftag{
  position:absolute;padding:5px 10px;border-radius:4px;
  background:rgba(6,10,16,0.85);border:1px solid rgba(14,165,233,0.12);
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--t2);white-space:nowrap;
}
.ftag b{display:block;font-size:10px;font-weight:700;color:var(--green);margin-top:1px;}
.ftag.l{left:-4px;top:48%;transform:translateY(-50%);animation:ft1 6s ease-in-out infinite;}
.ftag.r{right:-4px;top:35%;transform:translateY(-50%);animation:ft2 6s ease-in-out infinite;animation-delay:-2s;}
.ftag .bracket{color:#2a4050;}
@keyframes lpulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ft1{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 6px))}}
@keyframes ft2{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 6px))}}

/* ── Market tags (terminal style brackets) ── */
.market-tags{
  display:flex;gap:8px;margin-top:2px;width:100%;justify-content:center;flex-wrap:wrap;
}
.market-tag{
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--t2);letter-spacing:0.5px;
  padding:3px 8px;background:rgba(8,12,20,0.85);border:1px solid rgba(14,165,233,0.08);border-radius:3px;
}
.market-tag .bracket{color:#2a4050;}
.market-tag .val{color:var(--t1);}
.market-tag .chg.up{color:var(--green);}
.market-tag .chg.dn{color:#ff4560;}

/* ── Form ── */
.form{width:100%;margin-top:8px;}
.field{margin-bottom:14px;}
.flbl{
  display:block;font-size:9px;font-weight:800;letter-spacing:2.5px;
  color:#4a5a7a;text-transform:uppercase;margin-bottom:7px;padding-left:2px;
}

/* Neomorphic input — terminal style */
.input-neo{
  width:100%;height:48px;border-radius:4px;
  background:rgba(8,12,18,0.7);position:relative;overflow:hidden;
  border:1px solid rgba(30,50,70,0.5);transition:border-color 0.3s,box-shadow 0.3s;
}
.input-neo.focused{
  border-color:rgba(0,229,255,0.5);
  box-shadow:0 0 12px rgba(0,229,255,0.10),inset 0 0 15px rgba(0,229,255,0.03);
}
.input-neo::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg, transparent, rgba(0,229,255,0.5), transparent);
  opacity:0;transform:translateX(-100%);
}
.input-neo.focused::before{opacity:1;animation:scan 2.5s linear infinite;}
.input-neo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg, transparent, rgba(0,229,255,0.03), transparent);
  opacity:0;transform:translateX(-100%);
}
.input-neo.focused::after{opacity:1;animation:scan 2.5s linear infinite;animation-delay:0.05s;}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
input{
  position:absolute;inset:0;width:100%;height:100%;
  background:transparent;border:none;outline:none;
  padding:0 16px;font-size:14px;color:#d1e4ff;
  font-family:'JetBrains Mono',monospace;
}
input::placeholder{color:var(--t3);}

/* ── Buttons (Chamfered 45°) ── */
.btn-wrap{position:relative;width:100%;height:52px;margin-top:6px;}
.btn-glow{
  position:absolute;top:3px;left:8%;right:8%;bottom:-12px;
  border-radius:4px;filter:blur(16px);opacity:0;
  animation:gpulse 3s ease-in-out infinite;
}
.btn-glow.c1{background:var(--cyan);}
.btn-glow.c2{background:#1a6090;}
@keyframes gpulse{0%,100%{opacity:0.15;transform:scaleX(0.85)}50%{opacity:0.35;transform:scaleX(1.0)}}

.btn-primary{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;cursor:pointer;overflow:hidden;
  background:linear-gradient(90deg, #008299 0%, #00E5FF 100%);
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
.btn-primary::after{
  content:'';position:absolute;left:10%;right:10%;top:48%;height:1px;
  background:rgba(255,255,255,0.25);border-radius:1px;
}
.btn-primary span{
  font-size:11px;font-weight:700;letter-spacing:2.5px;
  color:#fff;text-transform:uppercase;position:relative;z-index:1;text-shadow:0 0 8px rgba(0,0,0,0.3);
}

.btn-sec-wrap{position:relative;width:100%;height:52px;margin-top:8px;}
.btn-secondary{
  position:absolute;inset:0;width:100%;height:100%;
  border:1px solid rgba(40,70,100,0.4);cursor:pointer;overflow:hidden;
  background:rgba(12,20,32,0.7);
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
.btn-secondary span{
  font-size:11px;font-weight:700;letter-spacing:2.5px;
  color:#5080a0;text-transform:uppercase;
}

.btn-link{
  background:transparent;border:none;cursor:pointer;
  font-size:11px;font-weight:700;letter-spacing:2px;font-family:'Inter',sans-serif;
  color:#3a4a60;text-transform:uppercase;
  padding:10px;display:block;width:100%;text-align:center;margin-top:4px;
}

/* ── Footer ── */
.footer-txt{
  margin-top:8px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:8px;
  color:var(--t3);letter-spacing:0.5px;
}
.footer-txt .bracket{color:#1a2a3a;}

/* ── Floating particles (canvas) ── */
#particlesCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;}

/* ── Chromatic aberration overlay ── */
.chromatic{
  position:absolute;inset:0;z-index:991;pointer-events:none;mix-blend-mode:screen;opacity:0.015;
  background:repeating-linear-gradient(0deg, rgba(255,0,0,0.02) 0px, transparent 1px, rgba(0,255,255,0.02) 2px, transparent 3px);
}
</style>
</head>

<script>
function nf(id){document.getElementById(id).classList.add('focused')}
function nb(id){document.getElementById(id).classList.remove('focused')}

// ── Chart waves ──
(function(){
  const canvas=document.getElementById('chartCanvas');
  const ctx=canvas.getContext('2d');
  let t=0;
  canvas.width=390;canvas.height=844;
  function noise(x){return Math.sin(x*.6)*.4+Math.sin(x*1.3+1)*.25+Math.sin(x*2.5+2)*.15+Math.sin(x*5+.8)*.08+Math.sin(x*.2)*.5}
  function draw(){
    const W=canvas.width,H=canvas.height,N=140;
    ctx.clearRect(0,0,W,H);
    // Line 1 — main cyan
    const m1=H*.55,a1=H*.12;
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<=N;i++){const x=(i/N)*W,y=m1+noise(i*.13+t)*a1;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.shadowColor='#0ea5e9';ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(14,165,233,0.45)';ctx.lineWidth=1.8;ctx.stroke();
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    const g=ctx.createLinearGradient(0,m1-a1,0,H);
    g.addColorStop(0,'rgba(14,165,233,0.08)');g.addColorStop(1,'rgba(14,165,233,0)');
    ctx.fillStyle=g;ctx.shadowBlur=0;ctx.fill();
    ctx.restore();
    // Line 2 — green
    const m2=H*.3,a2=H*.06;
    ctx.save();ctx.beginPath();
    for(let i=0;i<=N;i++){const x=(i/N)*W,y=m2+noise(i*.1+t*.7+4)*a2;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.shadowColor='#00e5a8';ctx.shadowBlur=10;
    ctx.strokeStyle='rgba(0,229,168,0.2)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.restore();
    // Line 3 — purple
    const m3=H*.73,a3=H*.05;
    ctx.save();ctx.beginPath();
    for(let i=0;i<=N;i++){const x=(i/N)*W,y=m3+noise(i*.16+t*1.1+8)*a3;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.shadowColor='#818cf8';ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(129,140,248,0.18)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    t+=.006;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Particles ──
(function(){
  const canvas=document.getElementById('particlesCanvas');
  const ctx=canvas.getContext('2d');
  const W=390,H=844;
  canvas.width=W;canvas.height=H;
  const particles=[];
  const COLORS=['rgba(0,229,255,','rgba(0,229,168,','rgba(129,140,248,'];
  for(let i=0;i<18;i++){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
      r:Math.random()*2+1,o:Math.random()*0.3+0.1,
      c:COLORS[Math.floor(Math.random()*COLORS.length)],
      phase:Math.random()*Math.PI*2
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const p of particles){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      const alpha=p.o*(0.7+0.3*Math.sin(Date.now()*0.001+p.phase));
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+alpha+')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
